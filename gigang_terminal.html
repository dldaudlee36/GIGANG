  <style>
    /* =========================================================================
       1. RESET & GLOBAL CRAFT FLOOR (Golden Design Suite + App-Screens Rules)
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #08080a;
      color: #f4f4f6;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: auto;
    }
    .mono {
      font-family: "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
    }
    .num, th.num, td.num {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
    }
    .unit-suffix {
      font-size: 0.68em;
      font-weight: 400;
      opacity: 0.72;
      margin-left: 3px;
      white-space: nowrap;
    }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    :root {
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    button, a, [role="button"], .switch-toggle, .proto-picker__tab, .proto-picker__act, .sheet-drag-handle {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    button {
      cursor: pointer;
      transition: transform 130ms var(--ease-out),
                  background-color 150ms ease,
                  border-color 150ms ease,
                  color 150ms ease,
                  opacity 150ms ease;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }
    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #2f70bb;
      outline-offset: 2px;
    }
    ::selection {
      background: rgba(74, 138, 214, 0.24);
    }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    table.data-table th {
      font-size: 12px;
      font-weight: 500;
      padding: 10px 12px;
      white-space: nowrap;
      user-select: none;
    }
    table.data-table th.sortable {
      cursor: pointer;
    }
    table.data-table td {
      padding: 10px 12px;
      vertical-align: middle;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    td.col-id, td.col-time, td.col-score {
      white-space: nowrap;
    }
    /* Interactive table row left-bar & focus/hover affordance */
    tr.interactive-row {
      transition: background-color 140ms ease;
    }
    tr.interactive-row td:first-child {
      position: relative;
    }
    tr.interactive-row:hover td {
      background-color: rgba(128, 128, 140, 0.08);
    }
    /* Collapsible Floating Picker Dock (Zero Bottom Content Occlusion) */
    .proto-picker {
      transition: transform 220ms var(--ease-out), opacity 180ms var(--ease-out);
    }
    .proto-picker.is-minimized .proto-picker__tab,
    .proto-picker.is-minimized .proto-picker__sep,
    .proto-picker.is-minimized [data-act="dataset"],
    .proto-picker.is-minimized [data-act="replay"],
    .proto-picker.is-minimized .proto-picker__hi {
      display: none !important;
    }
    /* Subtle 3-Hop SVG Node Selection Ring */
    .hop-node-group {
      cursor: pointer;
    }
    .hop-node-group rect.hop-card-box {
      transition: stroke-width 150ms ease, stroke 150ms ease;
    }
    .hop-node-group.is-active-hop rect.hop-card-box {
      stroke-width: 2.4px;
    }
    .grid-4col > *, .grid-2col > *, .grid-2-1 > *, .term-workbench > *, .ledger-kpi-row > *,
    .term-kpi-cell, .sheet-kpi-cell, .oled-well, .oled-card, .term-panel, .sheet-card, .ledger-card {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .pill, .status-pill {
      flex-shrink: 0;
    }
    .switch-toggle input:focus-visible + .switch-slider {
      outline: 2px solid #5e9eff;
      outline-offset: 2px;
    }
    .empty-state-box {
      padding: 28px 18px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--ground);
      color: var(--muted);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    table.data-table th.num,
    table.data-table td.num {
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* Status Pills (Pale tint + high-contrast text per app-screens.md §7.6) */
    .status-pill,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex: none;
      font-variant-numeric: tabular-nums;
    }
    .pill-pos { background: var(--pill-pos-bg); color: var(--pill-pos-ink); }
    .pill-neg { background: var(--pill-neg-bg); color: var(--pill-neg-ink); }
    
    .pill-high { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .pill-watch { background: rgba(167, 139, 250, 0.18); color: #c084fc; border: 1px solid rgba(167, 139, 250, 0.45); }

    .pill-warn { background: var(--pill-warn-bg); color: var(--pill-warn-ink); }
    .pill-neu { background: var(--pill-neu-bg); color: var(--pill-neu-ink); }
    .dot-ind {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* =========================================================================
       2. THE PICKER (Verbatim from concept-design-pack/skills/prototype/PICKER.md)
       ========================================================================= */
    .proto-picker {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker__hi {
      position: absolute;
      top: 4px;
      left: 4px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      will-change: transform, width;
      transition:
        transform 240ms cubic-bezier(0.23, 1, 0.32, 1),
        width 240ms cubic-bezier(0.23, 1, 0.32, 1);
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker__hi { transition: none; }
    }
    .proto-picker__tab,
    .proto-picker__act {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
      white-space: nowrap;
    }
    .proto-picker__tab:hover,
    .proto-picker__act:hover {
      color: rgba(255, 255, 255, 0.92);
    }
    .proto-picker__tab[aria-pressed="true"] {
      color: #ffffff;
      font-weight: 600;
    }
    .proto-picker__num {
      font-family: var(--font-mono);
      font-size: 11px;
      opacity: 0.72;
    }
    .proto-picker__sep {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.14);
    }

    /* =========================================================================
       3. VARIANT 1: DATA TERMINAL (CloudWAN Enterprise Edition · Spacious Deep Petrol-Teal)
       ========================================================================= */
    .v-terminal {
      --ground: #081217;
      --surface: #0b181f;
      --raised: #10212b;
      --border: #172e3a;
      --rule: #132530;
      --control: #1f3c4b;
      --text: #e8f1f5;
      --muted: #829ba8;
      --faint: #577180;
      --accent: #3595a8;
      --positive: #34b38a;
      --negative: #f0656e;
      --warning: #e5a93b;
      --pill-pos-bg: rgba(52, 179, 138, 0.14); --pill-pos-ink: #6ee7b7;
      --pill-neg-bg: rgba(240, 101, 110, 0.14); --pill-neg-ink: #fda4af;
      --pill-warn-bg: rgba(229, 169, 59, 0.15); --pill-warn-ink: #fcd34d;
      --pill-neu-bg: rgba(53, 149, 168, 0.11); --pill-neu-ink: #a7c8d6;
      background: var(--ground);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
    }
    .v-terminal .term-rail {
      width: 92px;
      background: #071015;
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      align-items: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 12px calc(24px + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
      gap: 10px;
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      z-index: 45;
    }
    .v-terminal .term-rail-logo {
      width: 48px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(180deg, #132c38 0%, #0b1921 100%);
      border: 1px solid var(--control);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 0 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: #6fd3e6;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }
    .v-terminal .term-rail-btn {
      width: 68px;
      min-height: 58px;
      padding: 10px 4px;
      white-space: nowrap;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out), border-color 150ms var(--ease-out), transform 130ms var(--ease-out);
    }
    .v-terminal .term-rail-label {
      font-size: 11.5px;
      font-weight: 500;
      color: inherit;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    @media (hover: hover) and (pointer: fine) {
      .v-terminal .term-rail-btn:hover {
        color: var(--text);
        background: rgba(53, 149, 168, 0.08);
      }
    }
    .v-terminal .term-rail-btn.active {
      color: #7ee0f2;
      background: rgba(53, 149, 168, 0.14);
      border-color: rgba(53, 149, 168, 0.42);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
    }
    .v-terminal .term-rail-btn.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 15px;
      bottom: 15px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
    }
    .v-terminal .term-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .v-terminal .term-topbar {
      height: 60px;
      background: rgba(8, 18, 23, 0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 13.5px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .v-terminal .term-canvas {
      padding: 24px 32px 160px;
      max-width: 100%;
      width: 100%;
      margin: 0;
      box-sizing: border-box;
      flex: 1;
    }
    .v-terminal .term-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .v-terminal h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.35;
    }
    .v-terminal .term-sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 6px;
    }
    .v-terminal .term-workbench {
      display: grid;
      grid-template-columns: 1.18fr 1fr;
      gap: 28px;
      align-items: start;
    }
    /* Case Dashboard Theme (Obsidian Dark + Tinted Severity & Category Cards) */
    .v-terminal.case-theme {
      --ground: #0e1014;
      --surface: #171a20;
      --raised: #1c2027;
      --border: #232730;
      --rule: #1e222a;
      --control: #2c323d;
      --text: #f3f4f6;
      --muted: #8b929e;
      --faint: #6b7280;
      --accent: #22c55e;
      --positive: #22c55e;

    }
    .case-sidebar {

    .case-side-group-title {

    }

    }

    }

    .case-kpi-label {

    /* =========================================================================
       7. SHARED INTERACTIVE COMPONENTS (Toast, Modals, Toggle Switch, 3-Hop SVG)
       ========================================================================= */
    .switch-toggle {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .switch-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(128, 128, 128, 0.35);
      border-radius: 999px;
      transition: background-color 160ms ease;
    }
    .switch-slider::before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform 180ms var(--ease-out);
      will-change: transform;
    }
    .switch-toggle input:checked + .switch-slider {
      background-color: #247b50;
    }
    .switch-toggle.danger-switch input:checked + .switch-slider {
      background-color: #c4242a;
    }
    .switch-toggle input:checked + .switch-slider::before {
      transform: translateX(14px);
    }

    /* Non-blocking Sonner-style Toast Stack (CSS Transitions + @starting-style, zero keyframes) */
    .toast-stack {
      display: none !important;
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 2147483640;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      min-width: 290px;
      max-width: 420px;
      background: #171719;
      color: #ffffff;
      border: 1px solid #343438;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out);
      will-change: transform, opacity;
    }
    @starting-style {
      .toast-item {
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
      }
    }
    .toast-item.is-leaving {
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
    }

    /* Modal Backdrop & Dialog (Smooth scale(0.96) -> scale(1), never scale(0)) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2147483630;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 200ms var(--ease-out), visibility 200ms var(--ease-out);
    }
    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .modal-dialog {
      background: #171719;
      color: #ffffff;
      border: 1px solid #343438;
      border-radius: 10px;
      width: 100%;
      max-width: 460px;
      padding: 20px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      transform: scale(0.96) translateY(6px);
      opacity: 0;
      transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out);
      will-change: transform, opacity;
    }
    .modal-backdrop.open .modal-dialog {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* =========================================================================
       Zero-Fatigue Eye-Friendly Motion System (시각 피로 최소화 벨벳 모션 시스템)
       1) 스트로브/암전 없는 부드러운 안착 모션 (0% 출발 배제, 88% 출발 160ms 벨벳 글라이드)
       2) 애플/에밀 코발스키 햅틱 물리 버튼 피드백 (Hover -1px 리프트, Active 0.97 컴프레션)
       3) 60fps GPU 가속 레이아웃 리플로우 방지 (transform & opacity 전용)
       ========================================================================= */
    @keyframes softVelvetSettle {
      0% {
        opacity: 0.88;
        transform: translateY(3px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .soft-settle {
      animation: softVelvetSettle 160ms cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: opacity, transform;
    }

    button, input, select, textarea, a, .term-btn, .neo-nav-item, .term-rail-btn {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      outline: none !important;
    }
    button:focus, button:active, .term-btn:focus, .term-btn:active, .neo-nav-item:focus, .neo-nav-item:active {
      outline: none !important;
    }

    /* Buttons: Tactile micro-interaction with high-end spring curve */
    .term-btn, .v-terminal.neo .term-btn {
      transition: transform 140ms cubic-bezier(0.2, 0, 0, 1),
                  background-color 140ms ease,
                  border-color 140ms ease,
                  box-shadow 140ms ease,
                  color 140ms ease !important;
      will-change: transform;
    }
    .term-btn:hover, .v-terminal.neo .term-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 201, 186, 0.16);
    }
    .term-btn:active, .v-terminal.neo .term-btn:active {
      transform: scale(0.97) !important;
      transition: transform 70ms cubic-bezier(0.2, 0, 0, 1) !important;
    }

    /* Left Nav Items: Gentle slide & soft active tactile feedback */
    .neo-nav-item, .term-rail-btn {
      transition: transform 140ms cubic-bezier(0.2, 0, 0, 1),
                  background-color 150ms ease,
                  color 150ms ease,
                  box-shadow 150ms ease !important;
      will-change: transform;
    }
    .neo-nav-item:hover, .term-rail-btn:hover {
      transform: translateX(2px);
      background: rgba(var(--color-accent-code), 0.08);
    }
    .neo-nav-item:active, .term-rail-btn:active {
      transform: scale(0.98) !important;
      transition: transform 70ms cubic-bezier(0.2, 0, 0, 1) !important;
    }
    .neo-nav-item::after {
      transition: opacity 160ms cubic-bezier(0.2, 0, 0, 1),
                  transform 160ms cubic-bezier(0.2, 0, 0, 1) !important;
    }

    /* Interactive Cards & Forensic Windows: Soft hover elevation */
    .term-panel, .cw-incident-card, .neo-window {
      transition: transform 180ms cubic-bezier(0.2, 0, 0, 1),
                  box-shadow 180ms cubic-bezier(0.2, 0, 0, 1),
                  border-color 160ms ease,
                  background-color 160ms ease !important;
      will-change: transform;
    }
    .cw-incident-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      border-color: rgba(var(--color-accent-code), 0.45);
    }
    .cw-incident-card:active {
      transform: scale(0.99) !important;
      transition: transform 70ms cubic-bezier(0.2, 0, 0, 1) !important;
    }

    /* Table Rows: Smooth eye-resting hover highlight */
    tr.interactive-row, .case-row {
      transition: background-color 120ms ease, transform 120ms cubic-bezier(0.2, 0, 0, 1) !important;
    }
    tr.interactive-row:hover, .case-row:hover {
      background-color: rgba(var(--color-accent-code), 0.05) !important;
    }
    tr.interactive-row:active, .case-row:active {
      transform: scale(0.998) !important;
      transition: transform 60ms ease !important;
    }

    /* Sidebar Smooth Rail Motion */
    .neo-side {
      transition: width 220ms cubic-bezier(0.16, 1, 0.3, 1),
                  padding 220ms cubic-bezier(0.16, 1, 0.3, 1) !important;
      will-change: width;
    }
    .neo-brand-toggle {
      transition: transform 160ms cubic-bezier(0.2, 0, 0, 1),
                  background-color 160ms ease !important;
    }
    .neo-brand-toggle:hover {
      transform: scale(1.06);
    }
    .neo-brand-toggle:active {
      transform: scale(0.94) !important;
      transition: transform 70ms cubic-bezier(0.2, 0, 0, 1) !important;
    }

    /* Interactive 3-Hop SVG Smooth Zoom & Zero-Latency Drag */
    #topo-svg-group {
      transition: transform 200ms var(--ease-out);
      will-change: transform;
    }
    .topology-viewport.is-dragging #topo-svg-group {
      transition: none !important;
    }

    /* Sliding Top-Nav Indicator for Variant 4 (Black Achromatic Ledger) */
    .v-ledger .ledger-nav {
      position: relative;
    }
    .v-ledger .ledger-nav-link.active {
      border-bottom-color: transparent;
    }
    .ledger-nav-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--text);
      transition: transform 220ms var(--ease-out), width 220ms var(--ease-out);
      will-change: transform, width;
      pointer-events: none;
    }

    /* Pointer Hover Gating & Reduced Motion Accessibility */
    @media (hover: hover) and (pointer: fine) {
      .term-btn:hover, .sheet-btn:hover, .oled-btn:hover, .ledger-btn:hover {
        transform: translateY(-1px);
      }
      .term-btn:active, .sheet-btn:active, .oled-btn:active, .ledger-btn:active {
        transform: scale(0.97);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
      .toast-item,
      .modal-dialog,
      #topo-svg-group,
      .ledger-nav-indicator,
      .switch-slider::before {
        transition-duration: 120ms !important;
        transform: none !important;
      }
    }

    /* Interactive 3-Hop SVG Viewport */
    .topology-viewport {
      width: 100%;
      height: 250px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      border-radius: 6px;
    }
    .topology-viewport:active {
      cursor: grabbing;
    }
    .topology-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 5;

    /* Mobile Drawer Navigation (Folds sidebar on <= 900px) */
    .mobile-menu-btn {
      display: none;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: stretch;
    }
    .grid-2-1 {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 28px;
      align-items: stretch;
    }
    .grid-4col {

      grid-template-columns: repeat(4, 1fr);

    /* Pull-to-refresh tactile indicator */
    .ptr-indicator {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translate3d(-50%, -60px, 0) scale(0.92);

      border: 1px solid #34343c;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      pointer-events: none;

      transition: transform 200ms var(--ease-out), opacity 180ms var(--ease-out);
      will-change: transform, opacity;
    }
    .ptr-indicator.is-pulling {

    }
    .sheet-drag-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;
      background: #484852;
      margin: 0 auto 12px;
      cursor: grab;
      touch-action: none;
    }

    /* Coarse pointer (Touch Devices): 16px input font-size prevents iOS auto-zoom; 44px min touch targets */
    @media (pointer: coarse) {
      input, textarea, select {
        font-size: 16px !important;
      }
      .term-btn, .sheet-btn, .oled-btn, .ledger-btn,
      .term-select, .sheet-select, .oled-select, .ledger-select,

    /* Craft Collapsible Details Disclosure & Segmented Tabs */
    details.craft-disclosure {

    details.craft-disclosure[open] > summary {

    .craft-disclosure-body {

    .craft-seg-bar {

    .craft-seg-btn {

    /* =========================================================================

    /* =========================================================================
       5 COLOR THEMES & 5 FONTS SYSTEM (NEO-TACTICAL SUITE)
       ========================================================================= */

      --active-mono: "Geist Mono", monospace;
    }
    :root[data-font="pretendard"] {
      --active-font: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      --active-mono: "IBM Plex Mono", monospace;
    }
    :root[data-font="ibm"] {
      --active-font: "IBM Plex Sans KR", "Pretendard", sans-serif;
      --active-mono: "IBM Plex Mono", monospace;
    }
    :root[data-font="jetbrains"] {
      --active-font: "SUIT", "Pretendard", sans-serif;
      --active-mono: "JetBrains Mono", monospace;
    }
    :root[data-font="jakarta"] {
      --active-font: "Plus Jakarta Sans", "Pretendard", sans-serif;

      --color-point: #008fec;
      --color-point-code: 0, 143, 236;
      --color-blue: #008fec;
      --color-error: #ff4d4f;
      --color-primary-text: #f6f7f8;
      --color-secondary-text: #b6bbcc;

      --color-pannel-code: 16, 12, 30;
      --color-card-code: 22, 17, 40;
      --color-accent: #c084fc;
      --color-accent-code: 192, 132, 252;
      --color-point: #a855f7;
      --color-point-code: 168, 85, 247;

      --color-error: #ff4d4f;
      --color-primary-text: #f8fafc;
      --color-secondary-text: #cbd5e1;
      --gradient-window-glow: linear-gradient(135deg, rgba(192, 132, 252, 0.32) 0%, rgba(99, 102, 241, 0.14) 50%, rgba(16, 12, 30, 0.8) 100%);

    /* THEME 4: Midnight Cobalt (미드나잇 코발트 / 딥 사파이어) */

      --color-background-dark: #020617;

      --color-primary-text: #f8fafc;
      --color-secondary-text: #bae6fd;

    /* THEME 5: Monolithic Carbon (모놀리식 카본 / 티타늄 슬레이트) */
    :root[data-color-theme="carbon"] {
      --color-background-dark: #090a0c;
      --color-pannel-dark: #14161b;
      --color-card-dark: #1a1d24;
      --color-background-code: 9, 10, 12;
      --color-pannel-code: 20, 22, 27;
      --color-card-code: 26, 29, 36;
      --color-accent: #e2e8f0;
      --color-accent-code: 226, 232, 240;
      --color-point: #94a3b8;
      --color-point-code: 148, 163, 184;
      --color-blue: #475569;
      --color-error: #ff4d4f;
      --color-primary-text: #f8fafc;
      --color-secondary-text: #94a3b8;
      --gradient-window-glow: linear-gradient(135deg, rgba(226, 232, 240, 0.22) 0%, rgba(71, 85, 105, 0.12) 50%, rgba(20, 22, 27, 0.8) 100%);
      --gradient-action-btn: linear-gradient(-135deg, #475569, #94a3b8);
    }

    body, .v-terminal.neo {
      font-family: var(--active-font) !important;
      background: var(--color-background-dark) !important;
    }
    .mono, .v-terminal.neo .mono, [style*="IBM Plex Mono"] {
      font-family: var(--active-mono) !important;
    }
    :root[data-theme="light"] {
      --color-background-dark: #f5f8fa;
      --color-pannel-dark: #edf1f8;
      --color-card-dark: #ffffff;
      --color-background-code: 245, 248, 250;
      --color-pannel-code: 237, 241, 248;
      --color-card-code: 255, 255, 255;
      --color-primary-text: #191919;
      --color-secondary-text: #4b4b4b;
      --gradient-window-glow: linear-gradient(135deg, var(--color-blue), 10%, rgba(37, 201, 186, 0.25));
    }

    .v-terminal.neo {
      --ground: var(--color-background-dark);
      --surface: var(--color-pannel-dark);
      --raised: var(--color-card-dark);
      --border: rgba(var(--color-accent-code), 0.16);
      --rule: rgba(var(--color-accent-code), 0.09);
      --control: rgba(var(--color-accent-code), 0.3);
      --text: var(--color-primary-text);
      --muted: var(--color-secondary-text);
      --faint: rgba(182, 187, 204, 0.6);
      --accent: var(--color-accent);
      --positive: var(--color-accent);
      --negative: #ff5233;
      --warning: #ffb020;
      --pill-pos-bg: rgba(37, 201, 186, 0.1);  --pill-pos-ink: #25c9ba;
      --pill-neg-bg: rgba(255, 40, 0, 0.1);    --pill-neg-ink: #ff6a4d;
      --pill-warn-bg: rgba(255, 176, 32, 0.1); --pill-warn-ink: #ffb020;
      --pill-neu-bg: rgba(182, 187, 204, 0.08); --pill-neu-ink: var(--color-secondary-text);
      font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      background: var(--color-background-dark);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    :root[data-theme="light"] .v-terminal.neo {
      --accent: #0f9e91;
      --positive: #0f9e91;
      --negative: #e02400;
      --warning: #b86e00;
      --border: rgba(0, 143, 236, 0.16);
      --rule: rgba(0, 143, 236, 0.09);
      --pill-pos-ink: #0b8a7f;
      --pill-neg-ink: #d42000;
      --pill-warn-ink: #a35f00;
    }
    .v-terminal.neo .term-canvas {
      padding: 24px 32px 160px;
      max-width: 100%;
      width: 100%;
      margin: 0;
      box-sizing: border-box;
    }

    /* Bold suppression: precise lines & weight, never heavy type */
    /* Bold suppression removed for high legibility */
    .v-terminal.neo h1 { font-size: 18px; letter-spacing: -0.01em; }
    .v-terminal.neo [style*="color:#7ee0f2"], .v-terminal.neo [style*="color:#8ce5f5"] { color: var(--accent) !important; }
    .v-terminal.neo [style*="color:#ffffff"], .v-terminal.neo [style*="color:#dcd7f8"] { color: var(--text) !important; }
    .v-terminal.neo [style*="color:#b8b0e8"] { color: var(--muted) !important; }

    /* Typography primitives */
    .neo-title { font-size: 18px; font-weight: 400; letter-spacing: -0.01em; color: var(--text); line-height: 1.3; }
    .neo-meta, .neo-help { font-size: 11.5px; font-weight: 500; line-height: 16px; color: #94a3b8; }
    .neo-kpi-label {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #b6bbcc;
      line-height: 1.4;
      display: block;
      text-transform: uppercase;
    }
    .neo-meta em, .neo-help em { font-style: normal; font-weight: 400; color: var(--accent); }
    .neo-label { font-size: 11px; font-weight: 600; color: #b6bbcc; letter-spacing: 0.06em; text-transform: uppercase; }
    .neo-num { font-size: 30px; font-weight: 200; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); }

    /* 1) Tactical Window Frame — 1px glow double-shell border */
    .neo-window, .neo-kpi,
    .v-terminal.neo .term-panel, .v-terminal.neo .term-card, .v-terminal.neo .term-inspector,
    .v-terminal.neo .term-kpi-strip, .v-terminal.neo details.craft-disclosure {
      background: linear-gradient(var(--color-pannel-dark), var(--color-pannel-dark)) padding-box, var(--gradient-window-glow) border-box;
      border: 1px solid rgba(var(--color-accent-code), 0.18);
      border-radius: 6px;
      box-shadow: 0 0 0 1px rgba(var(--color-accent-code), 0.12) inset;
    }
    .v-terminal.neo .term-panel, .v-terminal.neo .term-card, .v-terminal.neo .term-inspector { padding: 20px; }
    .neo-window { display: flex; flex-direction: column; min-width: 0; }
    .neo-win-head, .v-terminal.neo .cw-section-head {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0 12px 0 14px;
      background: linear-gradient(90deg, rgba(var(--color-accent-code), 0.26) 0%, rgba(var(--color-accent-code), 0.04) 100%) left bottom / 100% 1px no-repeat, var(--color-card-dark);
      border: 0;
      border-radius: 5px 5px 0 0;
      flex-shrink: 0;
    }
    .v-terminal.neo .cw-section-head { margin: -20px -20px 18px; }
    .neo-win-title, .v-terminal.neo .cw-section-title {
      font-size: 14px; font-weight: 400; color: var(--text); margin-right: auto; letter-spacing: -0.005em;
      display: inline-flex; align-items: center; gap: 10px; min-width: 0;
    }
    .v-terminal.neo .cw-section-title svg { display: none; }
    .neo-grid-ico, .v-terminal.neo .cw-section-title::before {
      content: "";
      width: 12px; height: 12px; flex-shrink: 0;
      color: var(--muted);
      background: radial-gradient(circle, currentColor 1px, transparent 1.4px) 0 0 / 4px 4px;
      transition: color 200ms ease-out;
    }
    .neo-win-head:hover .neo-grid-ico,
    .v-terminal.neo .cw-section-head:hover .cw-section-title::before { color: var(--color-accent); }
    .neo-win-dots, .v-terminal.neo .cw-section-head::after {
      content: "";
      width: 16px; height: 4px; flex-shrink: 0; margin-left: 2px;
      background: radial-gradient(circle, var(--muted) 1.2px, transparent 1.6px) 0 0 / 6px 4px repeat-x;
      opacity: 0.75;
    }
    .neo-grid-ico, .neo-win-dots, .v-terminal.neo .cw-section-title::before, .v-terminal.neo .cw-section-head::after { display: none; }
    .neo-win-body { padding: 20px; min-width: 0; }

    /* 2) Hollow-to-Solid Action Button */
    .v-terminal.neo .term-btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      height: 30px;
      padding: 0 18px;
      border-radius: 15px;
      border: 1px solid transparent;
      background: linear-gradient(rgba(var(--color-background-code), 0.75), rgba(var(--color-background-code), 0.75)) padding-box, var(--gradient-action-btn) border-box;
      color: var(--color-accent);
      font-size: 13px;
      font-weight: 400;
      justify-content: center;
      cursor: pointer;
      transition: color 300ms ease-out, transform 130ms ease-out;
    }
    :root[data-theme="light"] .v-terminal.neo .term-btn { color: var(--accent); }
    .v-terminal.neo .term-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--gradient-action-btn);
      opacity: 0;
      transition: opacity 300ms ease-out;
    }
    .v-terminal.neo .term-btn svg { stroke-width: 1.6; }
    @media (hover: hover) and (pointer: fine) {
      .v-terminal.neo .term-btn:hover { color: var(--color-card-dark); border-color: transparent; background: linear-gradient(rgba(var(--color-background-code), 0.75), rgba(var(--color-background-code), 0.75)) padding-box, var(--gradient-action-btn) border-box; }
      :root[data-theme="light"] .v-terminal.neo .term-btn:hover { color: #ffffff; }
      .v-terminal.neo .term-btn:hover::before { opacity: 1; }
    }
    .v-terminal.neo .term-btn:active { transform: scale(0.97); }
    .v-terminal.neo .term-btn:focus-visible { outline: 1px solid var(--color-accent); outline-offset: 2px; }
    .v-terminal.neo .term-btn-primary { min-width: 200px; }

    /* 3) Minimal Pill Input Fields */
    .v-terminal.neo .term-input, .v-terminal.neo .term-select {
      height: 28px;
      border-radius: 14px;
      border: 0;
      padding: 0 20px;
      background: rgba(var(--color-background-code), 0.75);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      outline: none;
      box-shadow: 0 0 0 1px transparent;
      transition: box-shadow 200ms ease-out;
    }
    .v-terminal.neo .term-input::placeholder { color: var(--muted); font-weight: 100; }
    @media (hover: hover) and (pointer: fine) {
      .v-terminal.neo .term-input:hover, .v-terminal.neo .term-select:hover { box-shadow: 0 0 0 1px rgba(var(--color-accent-code), 0.5); }
    }
    .v-terminal.neo .term-input:focus, .v-terminal.neo .term-select:focus { box-shadow: 0 0 0 1px var(--color-accent); }

    /* Key-value tables → top-label tactical fields */
    .v-terminal.neo .cw-prop-table { background: rgba(var(--color-card-code), 0.5); border: 1px solid var(--border); border-radius: 4px; }
    .v-terminal.neo .cw-prop-row { grid-template-columns: 1fr; border-bottom: 1px solid var(--rule); }
    .v-terminal.neo .cw-prop-key {
      background: transparent; border: 0; padding: 12px 16px 2px;
      font-size: 8px; font-weight: 100; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    }
    .v-terminal.neo .cw-prop-key[style*="color:var(--text)"] { font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--text) !important; }
    .v-terminal.neo .cw-prop-val { padding: 4px 16px 12px; font-size: 13px; font-weight: 300; }
    .v-terminal.neo .cw-field-well {
      background: rgba(var(--color-background-code), 0.75); border: 0; border-radius: 14px;
      min-height: 28px; padding: 5px 16px; font-size: 12.5px; box-shadow: 0 0 0 1px rgba(var(--color-accent-code), 0.12);
    }
    .v-terminal.neo .cw-callout {
      background: rgba(var(--color-accent-code), 0.05); border: 1px solid rgba(var(--color-accent-code), 0.18);
      border-radius: 4px; color: var(--text); font-size: 12px; font-weight: 300;
    }

    /* Tables & pills */
    .v-terminal.neo table.data-table th {
      background: var(--color-card-dark) !important; color: var(--muted); border-bottom: 1px solid var(--border) !important;
      font-size: 11px; letter-spacing: 0.02em; padding: 11px 16px;
    }
    .v-terminal.neo table.data-table th:not(:last-child),
    .v-terminal.neo .case-table th:not(:last-child) {
      border-right: 1px solid rgba(var(--color-accent-code), 0.22);
    }
    .v-terminal.neo .case-table th, .v-terminal.neo .gov-table th { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 열을 좁혀도 글자가 줄바꿈되지 않고 한 줄로 잘리게 한다 */
    .v-terminal.neo .case-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 거버넌스 표: 진단 소견(5번째 열)만 줄바꿈 허용, 나머지는 한 줄로 고정 */
    .v-terminal.neo .gov-table.resized td:not(:nth-child(5)) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-terminal.neo .gov-table.resized td:nth-child(5) { overflow: hidden; }
    .v-terminal.neo .case-table td button { white-space: nowrap; display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .col-resizer { position: absolute; top: 0; right: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 3; }
    .col-resizer::after { content: ''; position: absolute; top: 25%; bottom: 25%; left: 4px; width: 1px; background: transparent; transition: background 0.15s; }
    .col-resizer:hover::after { background: rgba(var(--color-accent-code), 0.9); box-shadow: 0 0 6px rgba(var(--color-accent-code), 0.7); }
    .v-terminal.neo table.data-table td { border-bottom: 1px solid var(--rule); font-size: 13px; font-weight: 300; padding: 13px 16px; }
    .v-terminal.neo table.data-table tr.selected-row td { background: rgba(var(--color-accent-code), 0.08); }
    @media (hover: hover) and (pointer: fine) {
      .v-terminal.neo table.data-table tr:hover td { background: rgba(var(--color-accent-code), 0.04); }
      .v-terminal.neo table.data-table th:hover,
      .v-terminal.neo .case-table th:hover {
        background: rgba(var(--color-accent-code), 0.09);
        color: #ffffff;
      }
    }
    .v-terminal.neo .pill {
      border-radius: 999px; font-size: 11px; font-weight: 400;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 34%, transparent);
    }
    .v-terminal.neo .term-kpi-val { font-weight: 200; }

    /* Overview layout - full edge-to-edge alignment */
    .neo-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; padding-right: 0; }
    .v-terminal.neo .term-canvas > :first-child:not(.neo-window):not(.term-panel) { padding-right: 0; }
    @media (max-width: 768px) {
      .v-terminal.neo .term-canvas > :first-child:not(.neo-window):not(.term-panel) { padding-right: 0; }
    }
    .neo-alert-body { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 16px 20px; }
    .neo-kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin: 18px 0; }
    .neo-kpi { padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .neo-split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    .neo-cells { display: grid; gap: 12px; }
    .neo-cells.c4 { grid-template-columns: repeat(4, 1fr); }
    .neo-cells.c3 { grid-template-columns: repeat(3, 1fr); }
    .neo-cell {
      border-radius: 4px; padding: 18px 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
      background: rgba(var(--color-card-code), 0.55); border: 1px solid var(--border);
    }
    .neo-cell .neo-num { font-size: 24px; }
    .neo-cell.t-err  { background: rgba(255, 77, 79, 0.12);   border-color: rgba(255, 77, 79, 0.45); }
    .neo-cell.t-warn { background: rgba(167, 139, 250, 0.12); border-color: rgba(167, 139, 250, 0.45); }
    .neo-cell.t-acc  { background: rgba(var(--color-accent-code), 0.07); border-color: rgba(var(--color-accent-code), 0.32); }
    .neo-cell.t-pt   { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.45); }
    .neo-link {
      display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
      font-family: inherit; font-size: 11px; font-weight: 400; color: var(--accent);
      background: none; border: 0; padding: 2px 0; cursor: pointer; transition: color 200ms ease-out;
    }
    .neo-link svg { stroke-width: 1.6; }
    @media (hover: hover) and (pointer: fine) { .neo-link:hover { color: #ffffff; text-shadow: 0 0 6px rgba(var(--color-accent-code), 0.5); } }
    .neo-link:focus-visible { outline: 1px solid var(--color-accent); outline-offset: 2px; border-radius: 2px; }

    /* Sidebar & Left Pane Toggle */
    .neo-side {
      width: 220px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; padding: 14px 12px 20px; z-index: 45;
      background: var(--color-pannel-dark);
      border-right: 1px solid rgba(var(--color-accent-code), 0.14);
      transition: width 220ms cubic-bezier(0.2, 0, 0, 1), padding 220ms ease;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .neo-brand {
      height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 4px;
      font-size: 14px; font-weight: 400; letter-spacing: 0.18em; color: var(--text);
      transition: padding 200ms ease;
    }
    .neo-brand-toggle {
      width: 32px; height: 32px; padding: 2px; border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 120ms ease;
    }
    .neo-brand-toggle:hover {
      color: var(--color-accent);
      background: rgba(var(--color-accent-code), 0.12);
      border-color: rgba(var(--color-accent-code), 0.32);
      transform: scale(1.06);
    }
    .neo-brand-toggle:active {
      transform: scale(0.94);
    }
    .neo-brand-toggle:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .neo-brand-logo-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(37, 201, 186, 0.45));
      display: block;
      pointer-events: none;
    }
    .neo-brand-text {
      white-space: nowrap;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: 0.14em;
      transition: opacity 160ms ease;
      cursor: pointer;
    }
    .neo-brand-meta {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); margin-left: auto; white-space: nowrap;
      background: rgba(var(--color-accent-code), 0.12);
      border: 1px solid rgba(var(--color-accent-code), 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      transition: opacity 160ms ease;
    }

    /* Collapsed Left Pane (Icon Rail Mode) */
    .neo-side.collapsed {
      width: 60px;
      padding: 14px 6px 20px;
    }
    .neo-side.collapsed .neo-brand {
      padding: 0;
      justify-content: center;
      gap: 0;
    }
    .neo-side.collapsed .neo-brand-toggle {
      width: 36px;
      height: 36px;
      margin: 0 auto;
    }
    .neo-side.collapsed .neo-brand-logo-img {
      width: 28px;
      height: 28px;
    }
    .neo-side.collapsed .neo-brand-text,
    .neo-side.collapsed .neo-brand-meta,
    .neo-side.collapsed .neo-label,
    .neo-side.collapsed .neo-status-row,
    .neo-side.collapsed .neo-nav-item span {
      display: none !important;
    }
    .neo-side.collapsed .neo-nav-item {
      width: 44px;
      height: 38px;
      padding: 0;
      justify-content: center;
      border-radius: 10px;
      margin: 0 auto;
    }
    .neo-side.collapsed .neo-nav-item::after {
      display: none !important;
    }
    .neo-side.collapsed .neo-nav-item svg {
      margin: 0;
    }
    .neo-mini-status {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 0;
      margin-bottom: 6px;
      border-top: 1px solid rgba(var(--color-accent-code), 0.1);
      border-bottom: 1px solid rgba(var(--color-accent-code), 0.1);
    }
    .neo-side.collapsed .neo-mini-status {
      display: flex;
    }
    .neo-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .neo-nav-item {
      width: 100%; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
      border: 0; border-radius: 18px; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 13px; font-weight: 300; text-align: left; cursor: pointer;
      transition: background-color 200ms ease-out, color 200ms ease-out, box-shadow 200ms ease-out;
    }
    .neo-nav-item svg { stroke-width: 1.5; flex-shrink: 0; }
    .neo-nav-item::after {
      content: ""; width: 4px; height: 4px; border-radius: 50%; margin-left: auto;
      background: var(--color-accent); opacity: 0; transform: scale(0.4);
      transition: opacity 200ms ease-out, transform 200ms ease-out;
    }
    @media (hover: hover) and (pointer: fine) {
      .neo-nav-item:hover { color: var(--text); background: rgba(var(--color-accent-code), 0.05); }
      .neo-nav-item:hover::after { opacity: 1; transform: scale(1); }
    }
    .neo-nav-item.active { color: var(--accent); background: rgba(var(--color-accent-code), 0.08); box-shadow: inset 0 0 0 1px rgba(var(--color-accent-code), 0.25); }
    .neo-nav-item:focus-visible { outline: 1px solid var(--color-accent); outline-offset: 1px; }
    .neo-status-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 14px; font-size: 11px; font-weight: 100; color: var(--muted); }
    .neo-status-row em { font-style: normal; font-weight: 400; color: var(--accent); font-family: var(--font-mono); font-size: 10.5px; }

    /* 4) Floating Theme Toggle */
    .neo-theme-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 50;
      display: flex; padding: 1px; border-radius: 16px; border: 1px solid transparent;
      background: linear-gradient(rgba(var(--color-card-code), 0.9), rgba(var(--color-card-code), 0.9)) padding-box, var(--gradient-action-btn) border-box;
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .neo-theme-toggle button {
      position: relative; z-index: 1; width: 38px; height: 30px; border: 0; border-radius: 15px;
      background: none; color: var(--color-secondary-text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: color 300ms ease-out;
    }
    .neo-theme-toggle button:focus-visible { outline: 1px solid var(--color-accent); outline-offset: 1px; }
    .neo-tt-ind {
      position: absolute; top: 1px; left: 1px; width: 38px; height: 30px; border-radius: 15px;
      background: var(--gradient-action-btn); transform: translateX(38px); transition: transform 300ms ease-out;
    }
    :root[data-theme="light"] .neo-tt-ind { transform: translateX(0); }
    :root:not([data-theme="light"]) .neo-theme-toggle .tt-night,
    :root[data-theme="light"] .neo-theme-toggle .tt-day { color: var(--color-card-dark); }
    @media (prefers-reduced-motion: reduce) {
      .neo-tt-ind, .v-terminal.neo .term-btn, .v-terminal.neo .term-btn::before { transition: none; }
    }

    @media (max-width: 1280px) {
      .neo-kpi-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 1080px) {
      .neo-split { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .neo-side { display: none; }
      .v-terminal.neo .term-canvas { padding: 20px 16px 148px !important; }
      .neo-page-head { padding-right: 0 !important; }
      .neo-kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .neo-kpi { padding: 16px 14px; }
      .neo-num { font-size: 24px; }
      .neo-cells.c4 { grid-template-columns: repeat(2, 1fr); }
      .neo-cells.c3 { grid-template-columns: 1fr; }
      .neo-theme-toggle { top: 14px; right: 14px; }
      .v-terminal.neo .term-btn-primary { min-width: 0; }
      .v-terminal.neo .cw-prop-key { border-bottom: 0 !important; padding: 12px 16px 2px !important; }
      .v-terminal.neo .cw-prop-val { padding: 4px 16px 12px !important; }
      .v-terminal.neo .term-rail {
        background: rgba(var(--color-card-code), 0.92) !important;
        border-top: 1px solid var(--border) !important;
      }
      .v-terminal.neo .term-rail-btn { color: var(--muted); }
      .v-terminal.neo .term-rail-btn.active { color: var(--accent); background: rgba(var(--color-accent-code), 0.1); border-color: rgba(var(--color-accent-code), 0.3); }
    }
      /* Global Tactical Focus Ring (WCAG 2.4.7) */
    :focus-visible {
      outline: 2px solid var(--color-accent) !important;
      outline-offset: 2px !important;
    }

    /* Neo-Tactical Control Dock (Mobile Optimized) */
    .neo-control-dock {
      display: none !important;
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(var(--color-pannel-code), 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(var(--color-accent-code), 0.3);
      border-radius: 9999px;
      padding: 5px 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      transition: all 200ms ease;
    }
    @media (max-width: 768px) {
      .neo-control-dock {
        top: 10px;
        right: 12px;
        left: auto;
        max-width: calc(100vw - 24px);
        gap: 6px;
        padding: 4px 10px;
        border-radius: 12px;
        overflow-x: auto;
      }
      .neo-control-dock select {
        max-width: 130px;
        font-size: 11px !important;
      }
    }
  </style>
</head>

    // 3-Hop 칸은 항상 3개, 모든 필드는 문자열로 보장한다(누락·null·초장문으로 화면이 깨지지 않게).
    function safeHops(inc) {
      const src = Array.isArray(inc && inc.hops) ? inc.hops : [];
      const out = [];
      for (let i = 0; i < 3; i++) {
        const h = src[i] || {};
        const f = (v) => { const t = String(v == null ? '' : v).trim(); return t || '-'; };
        out.push({ step: f(h.step || ('Step ' + (i + 1))), nodeLabel: f(h.nodeLabel), nodeSub: f(h.nodeSub),
                   time: f(h.time), actor: f(h.actor), detail: f(h.detail), real: h.real === true });
      }
      return out;
    }
    function clip(v, n) { const t = String(v == null ? '' : v); return t.length > n ? t.slice(0, n - 1) + '…' : t; }

    // 3-Hop 은 세 단계가 모두 실제 이벤트로 연결됐을 때만 '성립'. 아니면 그림 대신 요약 카드를 쓴다.
    function isChain(inc) { return safeHops(inc).every(h => h.real); }
    function renderPartialSummary(inc) {
      const sh = safeHops(inc);
      const done = sh.filter(h => h.real);
      const miss = sh.filter(h => !h.real);
      const row = (h, ok) => `<div style="display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--border, rgba(255,255,255,0.08));">
          <span class="mono" style="min-width:150px;font-size:12px;font-weight:700;color:${ok ? '#25c9ba' : '#f0b429'};">${escapeHtml(h.step.split('·').slice(1).join('·').trim())}</span>
          <span style="font-size:13px;color:var(--text);">${ok ? escapeHtml(h.detail) + ' · ' + escapeHtml(h.nodeSub) + ' · ' + escapeHtml(h.time) + ' KST' : '<span style="color:var(--muted);">' + escapeHtml(h.detail) + '</span>'}</span>
        </div>`;
      return `<div style="margin:16px;padding:4px 2px;">
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;">3-Hop 경로 미성립 · 확인된 단계 ${done.length}/3</div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">세 단계가 해시·파일·글자 수로 연결되지 않아 경로 그림을 그리지 않습니다. 연결 확인된 사실만 표시합니다.</div>
        ${sh.map(h => row(h, h.real)).join('')}
      </div>`;
    }
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function triggerHaptic(pattern = 12) {
      try {
        if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
          navigator.vibrate(pattern);
        }
      } catch (_) {}
    }

    function showToast(title, desc) {

      return;
    }

    function formatTTL(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }


    /* =========================================================================

       ========================================================================= */
    const HOSTED = window.parent !== window;
    let lastSnapSig = '';
    let seenResultNonce = null;
    function hostSend(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), '*');
    }
    window.gigangAct = function(action, payload, pendingMsg) {
      if (!HOSTED) {
        showToast('백엔드에 연결되어 있지 않습니다', 'Streamlit(streamlit run app.py)에서 열어야 이 동작이 실제로 수행됩니다.');
        return false;
      }
      state.pending = action;
      if (pendingMsg) showToast('처리 중', pendingMsg);
      hostSend('streamlit:setComponentValue', {
        value: { action, payload: payload || {}, nonce: Date.now() + '-' + Math.random().toString(36).slice(2) },
        dataType: 'json'
      });
      return true;

    function isEditing() {
      const a = document.activeElement;
      return a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA');
    }
    function applySnapshot(snap) {
      if (!snap) return;
      const listKeys = ['activeIncidentsData', 'casesData', 'watchUsers', 'weeklyActivity', 'incidents', 'auditHistory', 'govAssets', 'siteAccessGroups', 'pcSummary', 'pipelineLogs'];
      const result = snap.lastResult;
      const newResult = result && result.nonce !== seenResultNonce;
      const sig = JSON.stringify(listKeys.map(k => snap[k])) + JSON.stringify(snap.meta) + JSON.stringify(snap.diag || null);
      if (!newResult && sig === lastSnapSig) return;      // 바뀐 게 없으면 다시 그리지 않는다
      lastSnapSig = sig;
      const keep = {};
      state.siteAccessGroups.forEach(g => { keep[g.id] = { grantFormOpen: g.grantFormOpen, grantMinutes: g.grantMinutes, detailOpen: g.detailOpen }; });
      listKeys.forEach(k => { state[k] = snap[k] || []; });
      state.siteAccessGroups.forEach(g => Object.assign(g, keep[g.id] || {}));
      state.meta = snap.meta || {};
      state.serverNow = snap.serverNow ? new Date(snap.serverNow) : new Date();
      CASE_REF_NOW = state.serverNow;
      if (!state.caseFilters.dateFrom) window.setCaseDateRange(state.caseFilters.dateRange, true);
      state.railwayLive = Boolean(state.meta.railwayLive);
      state.geminiEnabled = Boolean(state.meta.geminiEnabled);
      state.lastSyncTime = state.meta.lastSuccess ? state.meta.lastSuccess.split(' ')[1] + ' KST' : '-';
      state.ttlSeconds = state.watchUsers.length ? Math.max(...state.watchUsers.map(w => w.ttlSeconds)) : 0;
      if (!state.incidents.some(i => i.id === state.selectedIncidentId)) state.selectedIncidentId = state.incidents.length ? state.incidents[0].id : '';
      state.diagResult = snap.diag ? { domain: snap.diag.domain, level: snap.diag.riskLevel, opinion: snap.diag.opinion, engine: snap.diag.engine } : null;
      state.pending = null;
      if (newResult) {
        seenResultNonce = result.nonce;
        showToast(result.ok ? '완료' : '실패', result.message);
      }
      if (typeof window.refreshGeminiModal === 'function') window.refreshGeminiModal();
      if (!isEditing()) renderStage({ animate: false });
    }

    const EMPTY_INC = { id: '-', empty: true, shortTitle: '-', title: '-', score: 0, severity: 'NORMAL', hops: [], reasons: [], summary: '', user: '-', pc: '-', ip: '-' };

    function pillClassForSeverity(sev) {
      const u = String(sev || '').toUpperCase();
      if (u.includes('BLOCKED') || u.includes('차단')) return 'pill pill-neg';

    function bindTopologyInteractions() {
      const vp = document.getElementById('topo-viewport');
      if (!vp) return;
      let dragging = false;
      let startX = 0;
      let startY = 0;

      vp.onwheel = function(e) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.12 : -0.12;
        window.zoomTopology(delta);
      };

      vp.onpointerdown = function(e) {
        if (e.target.closest('button')) return;
        dragging = true;
        vp.classList.add('is-dragging');
        try { vp.setPointerCapture(e.pointerId); } catch (_) {}
        startX = e.clientX - state.topoPanX;
        startY = e.clientY - state.topoPanY;
      };

      vp.onpointermove = function(e) {
        if (!dragging) return;
        state.topoPanX = e.clientX - startX;
        state.topoPanY = e.clientY - startY;
        const g = document.getElementById('topo-svg-group');
        if (g) {
          g.setAttribute('transform', `translate(${state.topoPanX}, ${state.topoPanY}) scale(${state.topoZoom})`);
        }
      };

      const endTopoDrag = function(e) {
        if (!dragging) return;
        dragging = false;
        vp.classList.remove('is-dragging');
        try { vp.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      vp.onpointerup = endTopoDrag;
      vp.onpointercancel = endTopoDrag;
    }

    /* 생성일 필터. 기준 시각은 목업 데이터가 찍힌 시점이다. 백엔드를 붙일 때 서버 현재 시각으로 교체한다. */
    let CASE_REF_NOW = new Date();
    const pad2 = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const CASE_DATE_CHIPS = { '오늘': 0, '최근 24시간': 1, '최근 7일': 6, '최근 30일': 29 };

    window.setCaseDateRange = function(val, silent) {
      const back = CASE_DATE_CHIPS[val];
      state.caseFilters.dateRange = val;
      state.caseFilters.dateTo = ymd(CASE_REF_NOW);
      state.caseFilters.dateFrom = ymd(addDays(CASE_REF_NOW, -back));
      state.caseFilters.page = 1;
      if (!silent) renderStage();
    };
    window.setCaseDateCustom = function(which, val) {
      const f = state.caseFilters;
      if (!val) return;
      f[which === 'from' ? 'dateFrom' : 'dateTo'] = val;
      if (f.dateFrom > f.dateTo) {               // 시작일이 종료일보다 늦으면 반대쪽을 맞춘다
        if (which === 'from') f.dateTo = f.dateFrom; else f.dateFrom = f.dateTo;
      }
      f.dateRange = '직접 선택';
      f.page = 1;
      renderStage();
    };
    // 필터 구간(ms). '최근 24시간'은 날짜 단위가 아니라 기준 시각에서 24시간 전까지로 계산한다.
    const caseDateBounds = f => {
      if (f.dateRange === '최근 24시간') return [CASE_REF_NOW.getTime() - 24 * 3600 * 1000, CASE_REF_NOW.getTime()];
      return [new Date(f.dateFrom + 'T00:00:00').getTime(), new Date(f.dateTo + 'T23:59:59.999').getTime()];
    };

      state.caseFilters.pageSize = Number(size);
      state.caseFilters.page = 1;

      const name = window.prompt('담당자 이름을 입력하세요', cur && cur !== '미배정' ? cur : (localStorage.getItem('gigang.operator') || ''));
      if (!name || !name.trim()) return;
      localStorage.setItem('gigang.operator', name.trim());
      window.gigangAct('assign', { id, assignee: name.trim() });
    };
    
    /* 표 열 너비 조절: 헤더 오른쪽 경계를 드래그. 너비는 브라우저(localStorage)에 저장된다.
       key = 'case'(케이스 목록, 9열) | 'gov'(AI 거버넌스 표, 6열) */
    const COL_MIN = 60;
    const COL_COUNTS = { case: 9, gov: 6 };
    Object.keys(COL_COUNTS).forEach(key => {
      try {
        const saved = JSON.parse(localStorage.getItem('gigang.' + key + 'ColWidths') || 'null');
        if (Array.isArray(saved) && saved.length === COL_COUNTS[key] && saved.every(w => Number.isFinite(w) && w >= COL_MIN)) state[key + 'ColWidths'] = saved;
      } catch (e) { /* 저장소를 쓸 수 없는 환경이면 세션 동안만 유지 */ }
    });

    window.startColResize = function(e, idx, key) {
      key = key || 'case';
      e.preventDefault(); e.stopPropagation();
      const table = e.target.closest('table');
      const cols = table.querySelectorAll('colgroup col');
      const widths = Array.from(table.querySelectorAll('thead tr:first-child th')).map(th => Math.round(th.getBoundingClientRect().width));
      const startX = e.clientX, startW = widths[idx];
      const apply = () => {
        cols.forEach((c, i) => { c.style.width = widths[i] + 'px'; });
        table.style.width = widths.reduce((a, b) => a + b, 0) + 'px';
        table.style.minWidth = '0';
        table.style.tableLayout = 'fixed';
        table.classList.add('resized');
      };
      apply();
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      const move = ev => { widths[idx] = Math.max(COL_MIN, Math.round(startW + ev.clientX - startX)); apply(); };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.style.cursor = ''; document.body.style.userSelect = '';
        state[key + 'ColWidths'] = widths.slice();
        try { localStorage.setItem('gigang.' + key + 'ColWidths', JSON.stringify(widths)); } catch (err) {}
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    };

    window.resetColWidths = function(key) {
      state[key + 'ColWidths'] = null;
      try { localStorage.removeItem('gigang.' + key + 'ColWidths'); } catch (e) {}
      renderStage();
    };
    window.resetCaseCols = function() { window.resetColWidths('case'); };

    window.toggleCaseSort = function(col) {
      if (!state.caseSort) state.caseSort = { col: 'createdAt', dir: 'desc' };

          const matchId = item.id.toLowerCase().includes(q);
          const matchTitle = item.title.toLowerCase().includes(q);

        return true;

        else if (sortCol === 'assignee') { va = a.assignee; vb = b.assignee; }

                      ${sz}

            <!-- 테이블 헤더 + 본문 테이블 (가로 스크롤 및 고정 컬럼 비율 적용) -->

                <thead>

                    <th onclick="window.toggleCaseSort('id')" style="padding:0 12px 0 16px;cursor:pointer;user-select:none;border-right:1px solid rgba(37,201,186,0.25);transition:background 0.15s, color 0.15s;" title="케이스 ID 정렬">케이스 ID ${getSortIcon('id')}<span class="col-resizer" onmousedown="window.startColResize(event,0)" onclick="event.stopPropagation()" title="드래그하여 너비 조절"></span></th>
                    <th onclick="window.toggleCaseSort('title')" style="padding:0 12px;cursor:pointer;user-select:none;border-right:1px solid rgba(37,201,186,0.25);transition:background 0.15s, color 0.15s;" title="제목 정렬">제목 및 세부 설명 ${getSortIcon('title')}<span class="col-resizer" onmousedown="window.startColResize(event,1)" onclick="event.stopPropagation()" title="드래그하여 너비 조절"></span></th>
                    <th onclick="window.toggleCaseSort('severity')" style="text-align:center;padding:0 8px;cursor:pointer;user-select:none;border-right:1px solid rgba(37,201,186,0.25);transition:background 0.15s, color 0.15s;" title="심각도 정렬">심각도 ${getSortIcon('severity')}<span class="col-resizer" onmousedown="window.startColResize(event,2)" onclick="event.stopPropagation()" title="드래그하여 너비 조절"></span></th>
                    <th onclick="window.toggleCaseSort('status')" style="text-align:center;padding:0 8px;cursor:pointer;user-select:none;border-right:1px solid rgba(37,201,186,0.25);transition:background 0.15s, color 0.15s;" title="상태 정렬">상태 ${getSortIcon('status')}<span class="col-resizer" onmousedown="window.startColResize(event,3)" onclick="event.stopPropagation()" title="드래그하여 너비 조절"></span></th>
                    <th onclick="window.toggleCaseSort('asset')" style="padding:0 12px;cursor:pointer;user-select:none;border-right:1px solid rgba(37,201,186,0.25);transition:background 0.15s, color 0.15s;" title="영향 자산 정렬">영향 자산 ${getSortIcon('asset')}<span class="col-resizer" onmousedown="window.startColResize(event,4)" onclick="event.stopPropagation()" title="드래그하여 너비 조절"></span></th>

                    <th onclick="window.toggleCaseSort('updatedAt')" style="text-align:center;padding:0 8px;cursor:pointer;user-select:none;border-right:1px solid rgba(37,201,186,0.25);transition:background 0.15s, color 0.15s;" title="수정일 정렬">수정일 ${getSortIcon('updatedAt')}<span class="col-resizer" onmousedown="window.startColResize(event,7)" onclick="event.stopPropagation()" title="드래그하여 너비 조절"></span></th>
                    <th onclick="window.toggleCaseSort('elapsed')" style="text-align:center;padding:0 16px 0 8px;cursor:pointer;user-select:none;transition:background 0.15s, color 0.15s;" title="경과 시간 정렬">경과 ${getSortIcon('elapsed')}<span class="col-resizer" onmousedown="window.startColResize(event,8)" onclick="event.stopPropagation()" title="드래그하여 너비 조절"></span></th>
                  </tr>
                  <!-- 1px 시안 발광선 -->
                  <tr>
                    <td colspan="9" style="padding:0;height:1px;background:rgba(37,201,186,0.4);box-shadow:0 0 8px rgba(37,201,186,0.4);"></td>
                  </tr>
                </thead>
                <tbody>
                  ${pageRows.length > 0 ? pageRows.map(item => `
                    <tr style="height:48px;border-bottom:1px solid rgba(37,201,186,0.12);transition:background 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.04)'" onmouseout="this.style.background='transparent'">
                      <!-- 케이스 ID -->
                      <td style="padding-left:16px;font-family:'IBM Plex Mono', monospace;font-size:12px;color:rgba(255,255,255,0.9);white-space:nowrap;">
                        <button type="button" onclick="window.openKillchainFor('${escapeHtml(item.id)}')" style="background:none;border:none;padding:0;color:inherit;font-family:inherit;font-size:inherit;cursor:pointer;text-align:left;" onmouseover="this.style.color='#25c9ba'" onmouseout="this.style.color='rgba(255,255,255,0.9)'">
                          ${escapeHtml(item.id)}
                        </button>
                      </td>
                      <!-- 제목 / 세부설명 -->
                      <td style="padding:0 12px;vertical-align:middle;overflow:hidden;">
                        <div style="display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          <span style="font-size:12px;font-weight:500;color:#ffffff;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.title)}</span>
                        </div>
                        <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          ${escapeHtml(item.description)}
                        </div>
                      </td>
                      <!-- 심각도 -->
                      <td style="text-align:center;white-space:nowrap;">
                        ${getSevBadge(item.severity)}
                      </td>
                      <!-- 상태 -->
                      <td style="text-align:center;white-space:nowrap;">
                        ${getStatusBadge(item.status)}
                      </td>
                      <!-- 영향 자산 -->
                      <td style="padding:0 12px;font-size:12px;color:#b6bbcc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                        ${item.asset.isFlow ? `
                          <div style="display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono', monospace;font-size:11.5px;white-space:nowrap;">
                            <span style="color:#f87171;">↑ ${escapeHtml(item.asset.srcIp)}</span>
                            <span style="color:#25c9ba;">→</span>
                            <span style="color:#60a5fa;">↓ ${escapeHtml(item.asset.dstIp)}</span>
                          </div>
                        ` : `
                          <div style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#25c9ba" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                            <span style="color:#ffffff;" title="${escapeHtml(item.asset.ip || '')}">${escapeHtml(item.asset.name)}</span>
                          </div>
                        `}
                      </td>
                      <!-- 담당 -->
                      <td style="padding:0 12px;font-size:12px;color:#b6bbcc;white-space:nowrap;">
                        <div style="display:flex;align-items:center;gap:6px;">
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                          <button type="button" onclick="window.assignCase('${escapeHtml(item.id)}')" title="클릭하여 담당자 지정" style="background:none;border:none;padding:0;cursor:pointer;font:inherit;color:${item.assignee === '미배정' ? '#94a3b8' : '#b6bbcc'};text-decoration:underline dotted;">${escapeHtml(item.assignee)}</button>
                        </div>
                      </td>
                      <!-- 생성일 -->
                      <td style="text-align:center;font-size:12px;color:#b6bbcc;font-family:'IBM Plex Mono', monospace;white-space:nowrap;">
                        ${item.createdAt}
                      </td>
                      <!-- 수정일 -->
                      <td style="text-align:center;font-size:12px;color:#b6bbcc;font-family:'IBM Plex Mono', monospace;white-space:nowrap;">
                        ${item.updatedAt}
                      </td>
                      <!-- 경과일 -->
                      <td style="text-align:center;font-size:12px;color:#25c9ba;padding-right:16px;font-family:'IBM Plex Mono', monospace;white-space:nowrap;">
                        ${elapsedLabel(item.createdAt)}
                      </td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="9" style="text-align:center;padding:48px 20px;color:#b6bbcc;">
                        <div style="font-size:14px;font-weight:500;color:#ffffff;margin-bottom:6px;">조건에 일치하는 보안 케이스가 없습니다.</div>
                        <button type="button" onclick="window.resetCaseFilters()" style="margin-top:8px;padding:6px 14px;border-radius:9999px;background:rgba(37,201,186,0.15);color:#25c9ba;border:1px solid rgba(var(--color-accent-code),0.45);font-size:12px;cursor:pointer;">

                        </button>
                      </td>
                    </tr>
                  `}

            <!-- 하단 페이지네이션 -->
            <div style="margin-top:auto;padding-top:14px;border-top:1px solid rgba(37,201,186,0.4);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;">
              ${(() => {
                const btn = (label, pg, active, disabled) => `<button type="button" ${disabled ? 'disabled' : `onclick="window.setCasePage(${pg})"`} style="min-width:30px;height:30px;padding:0 10px;border-radius:4px;font-size:11.5px;${active ? 'font-weight:600;color:#ffffff;background:var(--gradient-action-btn);border:none;' : 'color:#b6bbcc;background:rgba(13,45,60,0.5);border:1px solid rgba(255,255,255,0.1);'}cursor:${disabled ? 'default' : 'pointer'};opacity:${disabled ? 0.4 : 1};">${label}</button>`;
                const pages = [];
                for (let i = 1; i <= totalPages; i++) {
                  if (i === 1 || i === totalPages || Math.abs(i - f.page) <= 1) pages.push(i);
                  else if (pages[pages.length - 1] !== '…') pages.push('…');
                }
                return btn('이전', f.page - 1, false, f.page <= 1)
                  + pages.map(pg => pg === '…' ? '<span style="color:#94a3b8;font-size:12px;padding:0 4px;">…</span>' : btn(pg, pg, pg === f.page, false)).join('')
                  + btn('다음', f.page + 1, false, f.page >= totalPages);
              })()}
            </div>
          </section>

        </div>
      `;
    }

    function renderKillchainSubView(cfg) {
      const inc = getSelectedIncident();
      if (inc.empty) return `<div style="padding:60px 0;text-align:center;color:#94a3b8;font-size:14px;">수집된 데이터 없음 — 분석할 인시던트가 없습니다.</div>`;
      return `
        <!-- Spacious CloudWAN Header -->
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <h1>킬체인 경로 분석</h1>
            <span class="${pillClassForSeverity(inc.severity)}">${inc.severity} · ${inc.score}점</span>
            <span class="mono" style="font-size:13px;color:var(--muted);">${inc.id} · ${inc.time}</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <select id="kc-incident-select" class="${cfg.selectClass}" onchange="window.selectIncident(this.value)" aria-label="분석 대상 인시던트 선택">
              ${state.incidents.map(item => `
                <option value="${item.id}" ${item.id === inc.id ? 'selected' : ''}>
                  [${item.id}] ${item.shortTitle} (${item.score}점)
                </option>
              `).join('')}
            </select>
            <button type="button" class="${cfg.btnClass}" onclick="window.setPage('overview')">← 종합 관제</button>
          </div>
        </div>

        <!-- Spacious CloudWAN Section 1: 기본 인시던트 명세 + 3-Hop 네트워크 경로 맵 -->
        <div class="${cfg.cardClass}" style="margin-bottom:28px;">
          <div class="cw-section-head">
            <span class="cw-section-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <span>인시던트 명세 및 3-Hop 네트워크 경로</span>
            </span>
            ${(() => { const n = safeHops(inc).filter(h => h.real).length;
              const ok = n >= 3;
              return `<span style="display:inline-flex;align-items:center;gap:10px;"><span class="mono" style="font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:9999px;border:1px solid ${ok ? '#25c9ba' : '#f0b429'};color:${ok ? '#25c9ba' : '#f0b429'};">${ok ? '3-Hop 성립' : '경로 미성립 ' + n + '/3'}</span><span class="mono" style="font-size:12px;color:var(--muted);">HOP 01 → HOP 02 → HOP 03</span></span>`; })()}
          </div>

          <div class="cw-prop-table" style="margin-bottom:24px;">
            <div class="cw-prop-row">
              <div class="cw-prop-key">시나리오</div>
              <div class="cw-prop-val">
                <div style="font-weight:600;font-size:15px;">${inc.title}</div>
                <div style="font-size:13px;color:var(--muted);">${inc.summary}</div>
              </div>
            </div>
            <div class="cw-prop-row">
              <div class="cw-prop-key">공격 경로</div>
              <div class="cw-prop-val">
                <div class="cw-field-well mono">
                  <span>${inc.source}</span>
                  <span style="color:var(--accent);font-weight:700;">→</span>
                  <span style="color:var(--negative);font-weight:600;">${inc.target}</span>
                </div>
              </div>
            </div>
          </div>

          ${isChain(inc) ? renderInteractive3HopSvg(inc, cfg.isDark, cfg.accentHex, false) : renderPartialSummary(inc)}
        </div>

        <!-- Spacious 2-Column Split: 공격 행위 타임라인 vs 탐지 근거 -->
        <div class="grid-2col">
          <div class="${cfg.cardClass}">
            <div class="cw-section-head">
              <span class="cw-section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <span>공격 행위 타임라인</span>

      const q = (state.govSearch || '').trim().toLowerCase();
      let rows = state.govAssets.filter(a =>
        !q ||
        a.domain.toLowerCase().includes(q) ||

        a.aiOpinion.toLowerCase().includes(q)

      rows.sort((a, b) => {
        const col = state.govSortCol;

                    <span class="pill pill-neu mono">${escapeHtml(state.diagResult.engine || '')}</span>

                `}

            </div>
          </div>

                placeholder="도메인·서비스 검색..." autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search"
