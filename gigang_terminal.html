                  <th class="num">차단 정책${GOV_HANDLE(5)}</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length > 0 ? rows.map(r => {
                  const pct = Math.round((r.liveHits / maxHits) * 100);
                  const rowFillStyle = cfg.useRowFill
                    ? `background: linear-gradient(90deg, rgba(94,158,255,0.12) ${pct}%, transparent ${pct}%);`

                  const opinionStyle = govColWidths ? 'white-space:normal;' : state.govViewMode === 'compact'
                    ? 'max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'

                  return `
                    <tr style="${rowFillStyle}">
                      <td>
                        <div class="mono" style="font-weight:600;color:var(--text);font-size:14px;">${escapeHtml(r.domain)}</div>
                        <div style="font-size:12px;color:var(--muted);margin-top:3px;">${escapeHtml(r.service)} · ${escapeHtml(r.category)}</div>
                      </td>
                      <td>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;">
                          <span class="${pillClassForSeverity(r.riskLevel)}">${escapeHtml(r.riskLevel)} · ${r.riskScore == null ? '점수 없음' : r.riskScore + '점'}</span>

                      </td>
                      <td class="num">
                        <div style="font-weight:600;color:var(--text);">${r.liveHits}건 <span style="font-weight:400;color:var(--muted);font-size:12px;">(${r.liveDevices}대)</span></div>

                      <td class="num">

                      <button type="button" class="${cfg.btnClass}" onclick="window.setGovSearch('')">필터 초기화</button>
                    </td>
                  </tr>
                `}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

        g.domain.toLowerCase().includes(sq) ||
        g.user.toLowerCase().includes(sq) ||
        g.ip.toLowerCase().includes(sq)
      );

        const ipOk = state.pipeIpFilter === 'ALL' || l.ip === state.pipeIpFilter;

    /* =========================================================================

    function renderWeeklyBars(barColor, trackBg) {
      const maxVal = Math.max(...state.weeklyActivity.map(d => d.count), 1);
      const total = state.weeklyActivity.reduce((acc, d) => acc + d.count, 0);
      return `
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="font-size:14px;font-weight:600;">주간 위협 탐지 추이</div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="pill pill-neu mono">합계 ${total}건</span>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:12px;align-items:end;height:130px;padding:12px 4px 4px;">
            ${state.weeklyActivity.map(item => {
              const hPct = Math.max(14, Math.round((item.count / maxVal) * 86));
              const isPeak = item.count === maxVal;
              return `
                <div style="display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
                  <span class="mono" style="font-size:11px;font-weight:${isPeak ? '700' : '400'};color:${isPeak ? 'var(--text)' : 'var(--muted)'};">${item.count}</span>
                  <div style="width:100%;max-width:32px;height:88px;background:${trackBg};border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;padding:2px;">
                    <div style="width:100%;height:${hPct}%;background:${barColor};border-radius:4px;opacity:${isPeak ? '1' : '0.78'};"></div>
                  </div>
                  <span class="mono" style="font-size:11px;color:var(--muted);">${item.day}</span>
                </div>
              `;
            }).join('')}
          </div>
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;font-size:12px;">
            <div style="padding:8px 10px;border-radius:6px;background:var(--ground);border:1px solid var(--border);">
              <div style="color:var(--muted);font-size:11px;">Shadow AI 반출</div>
              <div class="mono" style="font-weight:600;color:var(--text);margin-top:2px;">64건 <span style="color:var(--muted);font-weight:400;">(45.7%)</span></div>
            </div>
            <div style="padding:8px 10px;border-radius:6px;background:var(--ground);border:1px solid var(--border);">
              <div style="color:var(--muted);font-size:11px;">기밀 DB 대량 조회</div>
              <div class="mono" style="font-weight:600;color:var(--text);margin-top:2px;">49건 <span style="color:var(--muted);font-weight:400;">(35.0%)</span></div>
            </div>
            <div style="padding:8px 10px;border-radius:6px;background:var(--ground);border:1px solid var(--border);">
              <div style="color:var(--muted);font-size:11px;">30m TTL 복귀</div>
              <div class="mono" style="font-weight:600;color:var(--positive);margin-top:2px;">18건</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       5. VARIANT 1: DATA TERMINAL (CloudWAN Enterprise Edition · Spacious SOC Console)
       ========================================================================= */
    
    window.setColorTheme = function(themeId) {
      state.colorTheme = themeId;
      document.documentElement.setAttribute('data-color-theme', themeId);
      renderStage();
    };

    window.setFontFamily = function(fontId) {
      state.fontTheme = fontId;
      document.documentElement.setAttribute('data-font', fontId);
      renderStage();
    };

    window.setNeoTheme = function(theme) {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      if (current === theme) return;
      if (theme === 'light') root.setAttribute('data-theme', 'light');
      else root.removeAttribute('data-theme');
      // let the indicator slide first, then re-render theme-aware SVGs
      setTimeout(() => renderStage({ animate: false }), 320);
    };

        pipeline: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>`,

        sun: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
        moon: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`
      };

      const win = (title, body, extraHead = '') => `
        <section class="neo-window">
          <header class="neo-win-head">
            <span class="neo-win-title">${title}</span>
            ${extraHead}
          </header>
          <div class="neo-win-body">${body}</div>
        </section>`;

      const normalCount = state.incidents.filter(i => i.severity === 'NORMAL').length;
      const typeCounts = Object.entries(state.pipelineLogs.reduce((m, l) => { const t = l.type || '-'; m[t] = (m[t] || 0) + 1; return m; }, {})).sort((a, b) => b[1] - a[1]);
      const typeTotal = typeCounts.reduce((a, t) => a + t[1], 0) || 1;
      const typeNames = { PASTE_ATTEMPT: '붙여넣기', FILE_UPLOAD_ATTEMPT: '파일 업로드', COPY_ATTEMPT: '복사', CLIPBOARD_COPY: '클립보드 복사', DB_DOWNLOAD: 'DB 다운로드', DB_SELECT: 'DB 조회', DB_IMAGE_CAPTURE: 'DB 화면 캡처', SCREEN_CAPTURE: '화면 캡처', SITE_BLOCKED: '사이트 차단', WEB_ACCESS: '웹 접속', DOWNLOAD_STARTED: '다운로드 시작', DOWNLOAD_COMPLETED: '다운로드 완료', DOWNLOAD_INTERRUPTED: '다운로드 중단' };
      const typeName = t => typeNames[t] || t;
      const domCounts = Object.entries(state.pipelineLogs.reduce((m, l) => { const d = String(l.site || '-').replace(/^https?:\/\//, '').split('/')[0].split(':')[0].toLowerCase(); if (d && d !== '-' && !d.endsWith('.ts.net')) m[d] = (m[d] || 0) + 1; return m; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const domMax = domCounts.length ? domCounts[0][1] : 1;
      const highCount = state.incidents.filter(i => i.severity === 'HIGH').length;
      const watchCount = state.incidents.filter(i => i.severity === 'WATCH').length;
      const sevCount = sev => state.incidents.filter(i => i.severity === sev).length;
      const firstOf = sev => (state.incidents.find(i => i.severity === sev) || inc).id;

      let bodyContent = '';
      if (state.page === 'overview') {
        bodyContent = `
          <div class="neo-page-head">
            <div>
              <h1 class="neo-title">종합 관제</h1>
              <p class="neo-meta" style="margin-top:6px;">마지막 동기화 <em>${state.lastSyncTime}</em> · 수집 이벤트 <em>${(state.meta && state.meta.totalEvents) || 0}건</em></p>
            </div>
            <button type="button" class="term-btn" onclick="window.syncRailwayLogs()">${ico.sync}<span>동기화</span></button>
          </div>

          <div class="neo-kpi-grid">
            <div class="neo-kpi">
              <span class="neo-num">${(state.meta && state.meta.totalEvents) || 0}</span>
              <span class="neo-kpi-label">수집 이벤트</span>
              <button type="button" class="neo-link" onclick="window.setPage('pipeline')">${ico.link}<span>상세 보기</span></button>
            </div>
            <div class="neo-kpi">
              <span class="neo-num">${state.incidents.length}</span>
              <span class="neo-kpi-label">상관분석 인시던트</span>
              <button type="button" class="neo-link" onclick="window.setPage('cases')">${ico.link}<span>상세 보기</span></button>
            </div>
            <div class="neo-kpi">
              <span class="neo-num" style="color:var(--negative);">${highCount}</span>
              <span class="neo-kpi-label" style="color:#f87171;">고위험 (HIGH)</span>
              <button type="button" class="neo-link" onclick="window.openKillchainFor('${firstOf('HIGH')}')">${ico.link}<span>상세 보기</span></button>
            </div>
            <div class="neo-kpi">
              <span class="neo-num" style="color:#c084fc;">${watchCount}</span>
              <span class="neo-kpi-label" style="color:#c084fc;">선제 관찰 (WATCH)</span>
              <button type="button" class="neo-link" onclick="window.openKillchainFor('${firstOf('WATCH')}')">${ico.link}<span>상세 보기</span></button>
            </div>
            <div class="neo-kpi">
              <span class="neo-num" style="color:var(--accent);">${normalCount}</span>
              <span class="neo-kpi-label">정상 (NORMAL)</span>
              <button type="button" class="neo-link" onclick="window.setPage('cases')">${ico.link}<span>상세 보기</span></button>
            </div>
            <div class="neo-kpi">
              <span class="neo-num mono" style="color:var(--accent);font-weight:300;" data-ttl-display="1">${formatTTL(state.ttlSeconds)}</span>
              <span class="neo-kpi-label" style="color:var(--accent);">골든타임 TTL · 30분</span>
              <button type="button" class="neo-link" onclick="window.setPage('active_incidents')">${ico.link}<span>상세 보기</span></button>
            </div>
          </div>

          <div class="neo-split">
            ${win('접속 상위 도메인', `
              ${domCounts.length ? `<div style="display:flex;flex-direction:column;gap:12px;padding-top:4px;">${domCounts.map((d, i) => `
                <div>
                  <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:5px;">
                    <span class="mono" style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(d[0])}">${escapeHtml(d[0])}</span>
                    <span class="mono" style="color:var(--muted);flex:none;">${d[1]}건</span>
                  </div>
                  <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="width:${Math.max(3, d[1] / domMax * 100)}%;height:100%;background:${i === 0 ? 'var(--accent)' : '#64748b'};border-radius:4px;"></div></div>
                </div>`).join('')}</div>` : '<div style="text-align:center;color:var(--muted);padding:20px 0;">수집된 데이터 없음</div>'}
            `, `<span class="neo-meta">상위 5개 · 내부(.ts.net) 제외</span>`)}
            ${win('탐지 유형별 분포', `
            ${typeCounts.length ? `<div style="display:flex;flex-direction:column;gap:10px;">${typeCounts.map((t, i) => `
              <div style="display:grid;grid-template-columns:104px 1fr 84px;gap:12px;align-items:center;">
                <span style="font-size:13px;color:var(--text);">${escapeHtml(typeName(t[0]))}</span>
                <div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden;"><div style="width:${Math.max(2, t[1] / typeTotal * 100)}%;height:100%;background:${i === 0 ? 'var(--accent)' : '#64748b'};border-radius:5px;"></div></div>
                <span class="mono" style="font-size:12px;color:var(--muted);text-align:right;">${t[1]}건 · ${Math.round(t[1] / typeTotal * 100)}%</span>
              </div>`).join('')}</div>` : '<div style="text-align:center;color:var(--muted);padding:20px 0;">수집된 데이터 없음</div>'}
          `, `<span class="neo-meta">현재 수집분 · ${typeCounts.length}개 유형</span>`)}
          </div>

        `;
      } else if (state.page === 'active_incidents') {
        bodyContent = renderActiveIncidentsSubView(cfg);
      } else if (state.page === 'cases') {
        bodyContent = renderCaseManagementSubView(cfg);
      } else if (state.page === 'killchain') {
        bodyContent = renderKillchainSubView(cfg);
      } else if (state.page === 'governance') {
        bodyContent = renderGovernanceSubView(cfg);
      } else {
        bodyContent = renderPipelineSubView(cfg);
      }

      const navItems = [
        { id: 'overview', label: '종합 관제', icon: ico.overview },
        { id: 'active_incidents', label: '활성 인시던트', icon: ico.activeIncidents },
        { id: 'cases', label: '케이스 목록', icon: ico.cases },
        { id: 'killchain', label: '킬체인 분석', icon: ico.killchain },
        { id: 'governance', label: 'AI 거버넌스', icon: ico.governance },
        { id: 'pipeline', label: '로그 파이프라인', icon: ico.pipeline }
      ];

      return `
        <div class="v-terminal neo">
<!-- Control Dock removed: Locked to Theme 1 (Deep Ocean) & Font 5 (Geist) -->

          <aside class="neo-side ${state.sidebarCollapsed ? 'collapsed' : ''}" aria-label="메인 메뉴">
            <div class="neo-brand">
              <button type="button" 
                      class="neo-brand-toggle" 
                      onclick="window.toggleSidebar()" 
                      title="${state.sidebarCollapsed ? '좌측 메뉴 펼치기 (Ctrl+B)' : '좌측 메뉴 접기 (Ctrl+B)'}" 
                      aria-label="${state.sidebarCollapsed ? '좌측 메뉴 펼치기' : '좌측 메뉴 접기'}" 
                      aria-expanded="${!state.sidebarCollapsed}">
                <img src="${GIGANG_EMBLEM_B64}" alt="GIGANG Logo" class="neo-brand-logo-img" />
              </button>
              <span class="neo-brand-text" onclick="window.toggleSidebar()" title="사이드바 토글">GIGANG</span>
              <span class="neo-brand-meta">SOC</span>
            </div>
            <div class="neo-label" style="padding:18px 14px 8px;">메인 메뉴</div>
            <nav style="display:flex;flex-direction:column;gap:4px;">
              ${navItems.map(n => `
                <button type="button" class="neo-nav-item ${state.page === n.id ? 'active' : ''}" onclick="window.setPage('${n.id}')" ${state.page === n.id ? 'aria-current="page"' : ''} title="${n.label}">
                  ${n.icon}<span>${n.label}</span>
                </button>
              `).join('')}
            </nav>

            <div style="margin-top:auto;display:flex;flex-direction:column;gap:4px;">
              <div class="neo-mini-status" title="Railway: ${state.railwayLive ? 'LIVE' : 'PAUSED'} | 분석 홉: 3-HOP | Gemini: ${state.geminiEnabled ? 'ONLINE' : 'RULE'}">
                <span class="neo-status-dot" style="background:${state.railwayLive ? 'var(--accent)' : 'var(--warning)'};box-shadow:0 0 6px ${state.railwayLive ? 'var(--accent)' : 'var(--warning)'};" title="Railway Live"></span>
                <span class="neo-status-dot" style="background:var(--color-accent);box-shadow:0 0 6px var(--color-accent);" title="3-Hop Analysis"></span>
                <span class="neo-status-dot" style="background:${state.geminiEnabled ? 'var(--accent)' : 'var(--warning)'};box-shadow:0 0 6px ${state.geminiEnabled ? 'var(--accent)' : 'var(--warning)'};" title="Gemini AI"></span>
              </div>
              <div class="neo-label" style="padding:0 14px 6px;">시스템 상태</div>
              <div class="neo-status-row"><span>Railway 연동</span><em style="color:${state.railwayLive && state.meta.fetchOk ? 'var(--accent)' : 'var(--warning)'};">${!state.railwayLive ? 'PAUSED' : (state.meta.fetchOk ? 'LIVE' : '오류')}</em></div>
              <div class="neo-status-row"><span>분석 홉</span><em>3-HOP</em></div>
              <div class="neo-status-row" style="margin-bottom:10px;"><span>Gemini 엔진</span><em style="color:${state.geminiEnabled ? 'var(--accent)' : 'var(--warning)'};">${state.geminiEnabled ? 'ONLINE' : 'RULE'}</em></div>
              <button type="button" class="neo-nav-item" onclick="window.openGeminiModal()" title="AI 엔진 설정">${ico.ai}<span>AI 엔진 설정</span></button>
            </div>
          </aside>

          <aside class="term-rail ${state.mobileNavOpen ? 'mobile-open' : ''}" aria-label="하단 메뉴">
            ${navItems.map(n => `
              <button type="button" class="term-rail-btn ${state.page === n.id ? 'active' : ''}" onclick="window.setPage('${n.id}')">
                ${n.icon}<span class="term-rail-label">${n.label.replace('로그 ', '').replace('AI ', '').replace(' 분석', '')}</span>
              </button>
            `).join('')}
            <button type="button" class="term-rail-btn" onclick="window.openGeminiModal()">
              ${ico.ai}<span class="term-rail-label">AI 설정</span>
            </button>
          </aside>

          <div class="term-main">
            <div class="term-canvas">
              ${bodyContent}
            </div>
          </div>
        </div>
      `;
    }

    function renderStage({ animate = true } = {}) {
      if (!stage) return;
      stage.innerHTML = renderVariantTerminal();
      const canvas = stage.querySelector('.term-canvas');
      if (canvas && animate) {
        canvas.classList.add('soft-settle');
      }
      bindTopologyInteractions();
      try {
        const fullHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, 1100);
        window.parent.postMessage({ type: 'gigang:resize', height: fullHeight }, '*');
      } catch (e) {}
    }

    // Live TTL Countdown Ticker (Updates DOM nodes with data-ttl-display without re-rendering inputs)
    setInterval(() => {
      if (state.ttlSeconds > 0) state.ttlSeconds--;
      const formatted = formatTTL(state.ttlSeconds);
      document.querySelectorAll('[data-ttl-display]').forEach(el => {
        el.textContent = el.textContent.includes('남음') ? `${formatted} 남음` : formatted;
      });
    }, 1000);

    // Standalone Data Terminal Initialization
    window.replay = function() {
      renderStage();
    };

    addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('gemini-modal');
        if (modal && modal.classList.contains('open')) {
          window.closeGeminiModal();
          return;
        }
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
        e.preventDefault();
        window.toggleSidebar();
        return;
      }
      if (e.key === '[' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.matches('input, textarea, select')) {
        e.preventDefault();
        window.toggleSidebar();
        return;
      }
      if (e.target.matches('input, textarea, select, [contenteditable]')) return;
      // Never animate keyboard-initiated variant switches (100+/day action gate per animate/SKILL.md)
      if (e.key >= '1' && e.key <= String(tabs.length)) select(Number(e.key), { animate: false });
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const cur = tabs.findIndex(t => t.getAttribute('aria-pressed') === 'true');
        const next = (cur + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
        select(next + 1, { animate: false });
      } else if (e.key === 'r' || e.key === 'R') replay();
      else if (e.key === 'h' || e.key === 'H') togglePickerMinimize();
    });

    // Native Bottom-Sheet Drag-to-Dismiss with rubber-banding & velocity handoff (apple-design §2, §5)
    (function initBottomSheetGesture() {
      const dialog = document.getElementById('gemini-modal-dialog');
      const backdrop = document.getElementById('gemini-modal');
      if (!dialog || !backdrop) return;
      let startY = 0;
      let lastY = 0;
      let lastT = 0;
      let velocityY = 0;
      let active = false;

      dialog.addEventListener('pointerdown', (e) => {
        if (e.target.matches('input, button, select, label, .switch-slider')) return;
        active = true;
        startY = lastY = e.clientY;
        lastT = performance.now();
        velocityY = 0;
        dialog.style.transition = 'none';
        try { dialog.setPointerCapture(e.pointerId); } catch (_) {}
      });

      dialog.addEventListener('pointermove', (e) => {
        if (!active) return;
        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        const rawDy = e.clientY - startY;
        velocityY = (e.clientY - lastY) / dt; // px/ms
        lastY = e.clientY;
        lastT = now;
        // Rubber-band resistance when pulling upward (rawDy < 0)
        const dampedDy = rawDy < 0 ? rawDy * 0.22 : rawDy;
        dialog.style.transform = `translateY(${dampedDy}px)`;
      });

      const finishSheetDrag = (e) => {
        if (!active) return;
        active = false;
        dialog.style.transition = '';
        const totalDy = e.clientY - startY;
        // Momentum projection: dismiss if dragged > 76px OR flicked downward with velocity > 0.55px/ms
        if (totalDy > 76 || (totalDy > 24 && velocityY > 0.55)) {
          triggerHaptic(14);
          dialog.style.transform = '';
          window.closeGeminiModal();
        } else {
          dialog.style.transform = '';
        }
      };
      dialog.addEventListener('pointerup', finishSheetDrag);
      dialog.addEventListener('pointercancel', finishSheetDrag);
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) window.closeGeminiModal();
      });
    })();

    // Native Pull-to-Refresh Sync Gesture at top of scroll container
    (function initPullToRefresh() {
      const ptr = document.getElementById('ptr-indicator');
      if (!ptr) return;
      let startY = 0;
      let pulling = false;
      let pullDist = 0;

      window.addEventListener('touchstart', (e) => {
        if (window.scrollY <= 0 && e.touches.length === 1) {
          startY = e.touches[0].clientY;
          pulling = true;
          pullDist = 0;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 8 && window.scrollY <= 0) {
          pullDist = Math.min(88, dy * 0.45);
          ptr.classList.add('is-pulling');
          ptr.style.opacity = String(Math.min(1, pullDist / 54));
          ptr.style.transform = `translate3d(-50%, ${pullDist - 40}px, 0) scale(${0.94 + Math.min(0.06, pullDist / 900)})`;
          ptr.textContent = pullDist >= 56 ? '손을 떼면 Railway 최신 로그 동기화' : '당겨서 Railway 최신 로그 동기화';
        }
      }, { passive: true });

      const endPull = () => {
        if (!pulling) return;
        pulling = false;
        ptr.classList.remove('is-pulling');
        if (pullDist >= 56) {
          triggerHaptic([12, 30, 16]);
          window.syncRailwayLogs();
        }
        ptr.style.opacity = '0';
        ptr.style.transform = 'translate3d(-50%, -60px, 0) scale(0.92)';
        pullDist = 0;
      };
      window.addEventListener('touchend', endPull, { passive: true });
      window.addEventListener('touchcancel', endPull, { passive: true });
    })();

    const initialUrl = new URL(location.href);
    const initialPage = initialUrl.searchParams.get('page');
    if (initialPage && ['overview', 'active_incidents', 'cases', 'killchain', 'governance', 'pipeline'].includes(initialPage)) {
      state.page = initialPage;
    }
    const initialSidebar = initialUrl.searchParams.get('sidebar');
    if (initialSidebar === 'collapsed') {
      state.sidebarCollapsed = true;
    }
    // Initialize Stage directly
    renderStage({ animate: false });
  </script>
</body>
