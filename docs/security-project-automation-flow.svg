<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f7f9fc"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#152238">보안 이벤트·네트워크 상관분석 자동화 흐름</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#55657a">로그 파일을 사람이 매번 넣는 방식이 아니라, 로그가 생기면 자동으로 수집·분석해 웹 대시보드에 표시</text><g font-family="Arial,sans-serif"><rect x="55" y="170" rx="18" width="175" height="115" fill="#e8f0ff" stroke="#7aa2f7"/><text x="142" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#1d3f72">로그 발생</text><text x="142" y="238" text-anchor="middle" font-size="15" fill="#34495e">인증 / 서버 / DB</text><text x="142" y="262" text-anchor="middle" font-size="15" fill="#34495e">방화벽 / 네트워크</text><rect x="285" y="170" rx="18" width="175" height="115" fill="#e9f8f1" stroke="#6cc49b"/><text x="372" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#17624a">자동 수집</text><text x="372" y="238" text-anchor="middle" font-size="15" fill="#34495e">파일 감시</text><text x="372" y="262" text-anchor="middle" font-size="15" fill="#34495e">Webhook / API</text><rect x="515" y="170" rx="18" width="175" height="115" fill="#fff5df" stroke="#e1ad45"/><text x="602" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#7a5712">정규화</text><text x="602" y="238" text-anchor="middle" font-size="15" fill="#34495e">서로 다른 로그를</text><text x="602" y="262" text-anchor="middle" font-size="15" fill="#34495e">같은 JSON 형식으로</text><rect x="745" y="170" rx="18" width="175" height="115" fill="#fbecec" stroke="#dc7a7a"/><text x="832" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#8a2b2b">탐지·상관분석</text><text x="832" y="238" text-anchor="middle" font-size="15" fill="#34495e">같은 IP? 사용자?</text><text x="832" y="262" text-anchor="middle" font-size="15" fill="#34495e">시간·포트·순서 연결</text><rect x="975" y="170" rx="18" width="175" height="115" fill="#efeafd" stroke="#9176d8"/><text x="1062" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#503b91">Incident</text><text x="1062" y="238" text-anchor="middle" font-size="15" fill="#34495e">공격 흐름 생성</text><text x="1062" y="262" text-anchor="middle" font-size="15" fill="#34495e">위험도·판단 근거</text><path d="M230 227 H285" stroke="#6b7b8f" stroke-width="3" marker-end="url(#a)"/><path d="M460 227 H515" stroke="#6b7b8f" stroke-width="3" marker-end="url(#a)"/><path d="M690 227 H745" stroke="#6b7b8f" stroke-width="3" marker-end="url(#a)"/><path d="M920 227 H975" stroke="#6b7b8f" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="370" rx="22" width="700" height="170" fill="#101827"/><text x="285" y="410" font-size="22" font-weight="700" fill="#ffffff">웹 대시보드 (Streamlit)</text><text x="285" y="447" font-size="17" fill="#cbd5e1">Incident 목록 · HIGH/MEDIUM/LOW · 공격 타임라인 · 네트워크 이동 경로</text><text x="285" y="480" font-size="17" fill="#cbd5e1">왜 같은 사건으로 묶였는지 판단 근거 표시 · 새 Incident 자동 갱신</text><text x="285" y="513" font-size="17" fill="#7dd3fc">사용자는 로그파일을 매번 업로드하지 않고 웹 화면에서 결과를 확인</text><path d="M1062 285 C1062 340 960 350 950 400" fill="none" stroke="#9176d8" stroke-width="3" marker-end="url(#a)"/><rect x="980" y="385" rx="18" width="170" height="105" fill="#fff" stroke="#e2e8f0"/><text x="1065" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#27364a">선택 기능</text><text x="1065" y="450" text-anchor="middle" font-size="15" fill="#44556b">Slack / 이메일</text><text x="1065" y="475" text-anchor="middle" font-size="15" fill="#44556b">자동 알림</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7b8f"/></marker></defs></svg>