<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" id="meta-theme-color" content="#0d0e11" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0e11" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8" />
  <meta name="color-scheme" content="dark light" />
  <title>GIGANG | Zero Trust 통합 보안 관제 &amp; Shadow AI 거버넌스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* =========================================================================
       1. RESET & GLOBAL CRAFT FLOOR (Golden Design Suite + App-Screens Rules)
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #08080a;
      color: #f4f4f6;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    .mono {
      font-family: "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
    }
    .num, th.num, td.num {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
    }
    .unit-suffix {
      font-size: 0.68em;
      font-weight: 400;
      opacity: 0.72;
      margin-left: 3px;
      white-space: nowrap;
    }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    :root {
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    button, a, [role="button"], .switch-toggle, .proto-picker__tab, .proto-picker__act, .sheet-drag-handle {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    button {
      cursor: pointer;
      transition: transform 130ms var(--ease-out),
                  background-color 150ms ease,
                  border-color 150ms ease,
                  color 150ms ease,
                  opacity 150ms ease;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }
    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #2f70bb;
      outline-offset: 2px;
    }
    ::selection {
      background: rgba(74, 138, 214, 0.24);
    }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    table.data-table th {
      font-size: 12px;
      font-weight: 500;
      padding: 10px 12px;
      white-space: nowrap;
      user-select: none;
    }
    table.data-table th.sortable {
      cursor: pointer;
    }
    table.data-table td {
      padding: 10px 12px;
      vertical-align: middle;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    td.col-id, td.col-time, td.col-score {
      white-space: nowrap;
    }
    /* Interactive table row left-bar & focus/hover affordance */
    tr.interactive-row {
      transition: background-color 140ms ease;
    }
    tr.interactive-row td:first-child {
      position: relative;
    }
    tr.interactive-row:hover td {
      background-color: rgba(128, 128, 140, 0.08);
    }
    /* Collapsible Floating Picker Dock (Zero Bottom Content Occlusion) */
    .proto-picker {
      transition: transform 220ms var(--ease-out), opacity 180ms var(--ease-out);
    }
    .proto-picker.is-minimized .proto-picker__tab,
    .proto-picker.is-minimized .proto-picker__sep,
    .proto-picker.is-minimized [data-act="dataset"],
    .proto-picker.is-minimized [data-act="replay"],
    .proto-picker.is-minimized .proto-picker__hi {
      display: none !important;
    }
    /* Subtle 3-Hop SVG Node Selection Ring */
    .hop-node-group {
      cursor: pointer;
    }
    .hop-node-group rect.hop-card-box {
      transition: stroke-width 150ms ease, stroke 150ms ease;
    }
    .hop-node-group.is-active-hop rect.hop-card-box {
      stroke-width: 2.4px;
    }
    .grid-4col > *, .grid-2col > *, .grid-2-1 > *, .term-workbench > *, .ledger-kpi-row > *,
    .term-kpi-cell, .sheet-kpi-cell, .oled-well, .oled-card, .term-panel, .sheet-card, .ledger-card {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .pill, .status-pill {
      flex-shrink: 0;
    }
    .switch-toggle input:focus-visible + .switch-slider {
      outline: 2px solid #5e9eff;
      outline-offset: 2px;
    }
    .empty-state-box {
      padding: 28px 18px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--ground);
      color: var(--muted);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    table.data-table th.num,
    table.data-table td.num {
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* Status Pills (Pale tint + high-contrast text per app-screens.md §7.6) */
    .status-pill,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex: none;
      font-variant-numeric: tabular-nums;
    }
    .pill-pos { background: var(--pill-pos-bg); color: var(--pill-pos-ink); }
    .pill-neg { background: var(--pill-neg-bg); color: var(--pill-neg-ink); }
    .pill-warn { background: var(--pill-warn-bg); color: var(--pill-warn-ink); }
    .pill-neu { background: var(--pill-neu-bg); color: var(--pill-neu-ink); }
    .dot-ind {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* =========================================================================
       2. THE PICKER (Verbatim from concept-design-pack/skills/prototype/PICKER.md)
       ========================================================================= */
    .proto-picker {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker__hi {
      position: absolute;
      top: 4px;
      left: 4px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      will-change: transform, width;
      transition:
        transform 240ms cubic-bezier(0.23, 1, 0.32, 1),
        width 240ms cubic-bezier(0.23, 1, 0.32, 1);
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker__hi { transition: none; }
    }
    .proto-picker__tab,
    .proto-picker__act {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
      white-space: nowrap;
    }
    .proto-picker__tab:hover,
    .proto-picker__act:hover {
      color: rgba(255, 255, 255, 0.92);
    }
    .proto-picker__tab[aria-pressed="true"] {
      color: #ffffff;
      font-weight: 600;
    }
    .proto-picker__num {
      font-family: var(--font-mono);
      font-size: 11px;
      opacity: 0.72;
    }
    .proto-picker__sep {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.14);
    }

    /* =========================================================================
       3. VARIANT 1: DATA TERMINAL (CloudWAN Enterprise Edition · Spacious Deep Petrol-Teal)
       ========================================================================= */
    .v-terminal {
      --ground: #081217;
      --surface: #0b181f;
      --raised: #10212b;
      --border: #172e3a;
      --rule: #132530;
      --control: #1f3c4b;
      --text: #e8f1f5;
      --muted: #829ba8;
      --faint: #577180;
      --accent: #3595a8;
      --positive: #34b38a;
      --negative: #f0656e;
      --warning: #e5a93b;
      --pill-pos-bg: rgba(52, 179, 138, 0.14); --pill-pos-ink: #6ee7b7;
      --pill-neg-bg: rgba(240, 101, 110, 0.14); --pill-neg-ink: #fda4af;
      --pill-warn-bg: rgba(229, 169, 59, 0.15); --pill-warn-ink: #fcd34d;
      --pill-neu-bg: rgba(53, 149, 168, 0.11); --pill-neu-ink: #a7c8d6;
      background: var(--ground);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
    }
    .v-terminal .term-rail {
      width: 92px;
      background: #071015;
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      align-items: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 12px calc(24px + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
      gap: 10px;
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      z-index: 45;
    }
    .v-terminal .term-rail-logo {
      width: 48px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(180deg, #132c38 0%, #0b1921 100%);
      border: 1px solid var(--control);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 0 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: #6fd3e6;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }
    .v-terminal .term-rail-btn {
      width: 68px;
      min-height: 58px;
      padding: 10px 4px;
      white-space: nowrap;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out), border-color 150ms var(--ease-out), transform 130ms var(--ease-out);
    }
    .v-terminal .term-rail-label {
      font-size: 11.5px;
      font-weight: 500;
      color: inherit;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    @media (hover: hover) and (pointer: fine) {
      .v-terminal .term-rail-btn:hover {
        color: var(--text);
        background: rgba(53, 149, 168, 0.08);
      }
    }
    .v-terminal .term-rail-btn.active {
      color: #7ee0f2;
      background: rgba(53, 149, 168, 0.14);
      border-color: rgba(53, 149, 168, 0.42);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
    }
    .v-terminal .term-rail-btn.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 15px;
      bottom: 15px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
    }
    .v-terminal .term-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .v-terminal .term-topbar {
      height: 60px;
      background: rgba(8, 18, 23, 0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 13.5px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .v-terminal .term-canvas {
      padding: 36px 40px 140px;
      max-width: 1640px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .v-terminal .term-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .v-terminal h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.35;
    }
    .v-terminal .term-sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 6px;
    }
    .v-terminal .term-workbench {
      display: grid;
      grid-template-columns: 1.18fr 1fr;
      gap: 28px;
      align-items: start;
    }
    /* Case Dashboard Theme (Obsidian Dark + Tinted Severity & Category Cards) */
    .v-terminal.case-theme {
      --ground: #0e1014;
      --surface: #171a20;
      --raised: #1c2027;
      --border: #232730;
      --rule: #1e222a;
      --control: #2c323d;
      --text: #f3f4f6;
      --muted: #8b929e;
      --faint: #6b7280;
      --accent: #22c55e;
      --positive: #22c55e;
      --negative: #f87171;
      --warning: #fbbf24;
    }
    .case-sidebar {
      width: 236px;
      background: #0b0d10;
      border-right: 1px solid #1c2026;
      display: flex;
      flex-direction: column;
      padding: 18px 14px 24px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      z-index: 45;
      user-select: none;
    }
    .case-side-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #e5e7eb;
      padding: 8px 6px;
      margin-top: 8px;
    }
    .case-side-group-title svg {
      color: #22c55e;
      flex-shrink: 0;
    }
    .case-tenant-box {
      background: #111419;
      border: 1px solid #242933;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12.5px;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .case-search-box {
      background: #111419;
      border: 1px solid #242933;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .case-nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .case-nav-item.sub {
      padding-left: 26px;
      font-size: 12.5px;
    }
    .case-nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #f3f4f6;
    }
    .case-nav-item.active {
      color: #22c55e;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.08);
    }
    .case-nav-item.active svg {
      color: #22c55e;
    }
    .case-alert-banner {
      background: #171a20;
      border: 1px solid #232730;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .case-kpi-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .case-kpi-card {
      background: #171a20;
      border: 1px solid #232730;
      border-radius: 10px;
      padding: 26px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }
    .case-kpi-num {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .case-kpi-label {
      font-size: 12.5px;
      color: #9ca3af;
      font-weight: 500;
    }
    .case-detail-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      color: #22c55e;
      background: transparent;
      border: none;
      padding: 2px 4px;
      cursor: pointer;
      margin-top: 2px;
    }
    .case-detail-link:hover {
      text-decoration: underline;
    }
    .case-section-box {
      background: #171a20;
      border: 1px solid #232730;
      border-radius: 10px;
      padding: 24px 26px;
      margin-bottom: 20px;
    }
    .case-section-title {
      font-size: 15.5px;
      font-weight: 700;
      color: #f3f4f6;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .case-sev-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }
    .case-sev-card {
      border-radius: 8px;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 7px;
      background: #1c2027;
      border: 1px solid #282d37;
    }
    .case-sev-card.sev-crit {
      background: rgba(127, 29, 29, 0.25);
      border-color: rgba(239, 68, 68, 0.45);
    }
    .case-sev-card.sev-high {
      background: rgba(124, 45, 18, 0.25);
      border-color: rgba(245, 158, 11, 0.45);
    }
    .case-sev-card.sev-med {
      background: rgba(30, 58, 138, 0.25);
      border-color: rgba(59, 130, 246, 0.45);
    }
    .case-type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .case-type-card {
      border-radius: 8px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 9px;
    }
    .case-type-card.type-auto {
      background: rgba(30, 41, 82, 0.32);
      border: 1px solid rgba(59, 130, 246, 0.42);
    }
    .case-type-card.type-manual {
      background: rgba(20, 69, 47, 0.32);
      border: 1px solid rgba(34, 197, 94, 0.42);
    }
    .case-type-card.type-corr {
      background: rgba(92, 45, 18, 0.32);
      border: 1px solid rgba(245, 158, 11, 0.42);
    }
    /* Spacious CloudWAN Section Cards & Structured Form-Table Rows */
    .v-terminal .term-card,
    .v-terminal .term-panel,
    .v-terminal .term-inspector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 26px 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.22);
    }
    .v-terminal .cw-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .v-terminal .cw-section-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .v-terminal .cw-section-title svg {
      color: #6fd3e6;
      flex-shrink: 0;
    }
    /* CloudWAN Signature Key-Value Form Table (Left Label Cell + Right Wide Field Cell) */
    .cw-prop-table {
      width: 100%;

    /* =========================================================================
       7. SHARED INTERACTIVE COMPONENTS (Toast, Modals, Toggle Switch, 3-Hop SVG)
       ========================================================================= */
    .switch-toggle {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .switch-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(128, 128, 128, 0.35);
      border-radius: 999px;
      transition: background-color 160ms ease;
    }
    .switch-slider::before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform 180ms var(--ease-out);
      will-change: transform;
    }
    .switch-toggle input:checked + .switch-slider {
      background-color: #247b50;
    }
    .switch-toggle.danger-switch input:checked + .switch-slider {
      background-color: #c4242a;
    }
    .switch-toggle input:checked + .switch-slider::before {
      transform: translateX(14px);
    }

    /* Non-blocking Sonner-style Toast Stack (CSS Transitions + @starting-style, zero keyframes) */
    .toast-stack {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 2147483640;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      min-width: 290px;
      max-width: 420px;
      background: #171719;
      color: #ffffff;
      border: 1px solid #343438;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out);
      will-change: transform, opacity;
    }
    @starting-style {
      .toast-item {
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
      }
    }
    .toast-item.is-leaving {
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
    }

    /* Modal Backdrop & Dialog (Smooth scale(0.96) -> scale(1), never scale(0)) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2147483630;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 200ms var(--ease-out), visibility 200ms var(--ease-out);
    }
    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .modal-dialog {
      background: #171719;
      color: #ffffff;
      border: 1px solid #343438;
      border-radius: 10px;
      width: 100%;
      max-width: 460px;
      padding: 20px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      transform: scale(0.96) translateY(6px);
      opacity: 0;
      transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out);
      will-change: transform, opacity;
    }
    .modal-backdrop.open .modal-dialog {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Stage & Staggered Card Entrance Choreography (Gated on pointer/replay, skipped on keyboard 1-4) */
    @keyframes stageFadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stage-animate .term-canvas > *,
    .stage-animate .sheet-stage > *,
    .stage-animate .oled-canvas > *,
    .stage-animate .ledger-main > * {
      animation: stageFadeUp 220ms var(--ease-out) both;
    }
    .stage-animate .term-canvas > *:nth-child(1),

    /* =========================================================================
       NEO-TACTICAL CYBER OS WINDOW SYSTEM (Variant 1 · Data Terminal)
       ========================================================================= */
    :root {
      --color-background-dark: #0d2d3c;
      --color-pannel-dark: #021c26;
      --color-card-dark: #031016;
      --color-background-code: 13, 45, 60;
      --color-pannel-code: 2, 28, 38;
      --color-card-code: 3, 16, 22;
      --color-accent: #25c9ba;
      --color-accent-code: 37, 201, 186;
      --color-point: #ff601a;
      --color-point-code: 255, 96, 26;
      --color-blue: #008fec;
      --color-error: #ff2800;
      --color-primary-text: #f6f7f8;
      --color-secondary-text: #b6bbcc;
      --gradient-window-glow: linear-gradient(135deg, rgba(var(--color-accent-code), 0.28) 0%, rgba(0, 143, 236, 0.12) 50%, rgba(var(--color-pannel-code), 0.8) 100%);
      --gradient-action-btn: linear-gradient(-135deg, var(--color-blue), var(--color-accent));
    }
    :root[data-theme="light"] {
      --color-background-dark: #f5f8fa;
      --color-pannel-dark: #edf1f8;
      --color-card-dark: #ffffff;
      --color-background-code: 245, 248, 250;
      --color-pannel-code: 237, 241, 248;
      --color-card-code: 255, 255, 255;
      --color-primary-text: #191919;
      --color-secondary-text: #4b4b4b;
      --gradient-window-glow: linear-gradient(135deg, var(--color-blue), 10%, rgba(37, 201, 186, 0.25));
    }

    .v-terminal.neo {
      --ground: var(--color-background-dark);
      --surface: var(--color-pannel-dark);
      --raised: var(--color-card-dark);
      --border: rgba(var(--color-accent-code), 0.16);
      --rule: rgba(var(--color-accent-code), 0.09);
      --control: rgba(var(--color-accent-code), 0.3);
      --text: var(--color-primary-text);
      --muted: var(--color-secondary-text);
      --faint: rgba(182, 187, 204, 0.6);
      --accent: var(--color-accent);
      --positive: var(--color-accent);
      --negative: #ff5233;
      --warning: #ffb020;
      --pill-pos-bg: rgba(37, 201, 186, 0.1);  --pill-pos-ink: #25c9ba;
      --pill-neg-bg: rgba(255, 40, 0, 0.1);    --pill-neg-ink: #ff6a4d;
      --pill-warn-bg: rgba(255, 176, 32, 0.1); --pill-warn-ink: #ffb020;
      --pill-neu-bg: rgba(182, 187, 204, 0.08); --pill-neu-ink: var(--color-secondary-text);
      font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      background: var(--color-background-dark);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    :root[data-theme="light"] .v-terminal.neo {
      --accent: #0f9e91;
      --positive: #0f9e91;
      --negative: #e02400;
      --warning: #b86e00;
      --border: rgba(0, 143, 236, 0.16);
      --rule: rgba(0, 143, 236, 0.09);
      --pill-pos-ink: #0b8a7f;
      --pill-neg-ink: #d42000;
      --pill-warn-ink: #a35f00;
    }
    .v-terminal.neo .term-canvas {
      padding: 32px 36px 140px;
      max-width: 1640px;
    }

    /* Bold suppression: precise lines & weight, never heavy type */
    .v-terminal.neo h1, .v-terminal.neo h2, .v-terminal.neo h3,
    .v-terminal.neo b, .v-terminal.neo strong, .v-terminal.neo th,
    .v-terminal.neo [style*="font-weight:500"], .v-terminal.neo [style*="font-weight:600"],
    .v-terminal.neo [style*="font-weight:700"], .v-terminal.neo [style*="font-weight: 600"] {
      font-weight: 400 !important;
    }
    .v-terminal.neo h1 { font-size: 18px; letter-spacing: -0.01em; }
    .v-terminal.neo [style*="color:#7ee0f2"], .v-terminal.neo [style*="color:#8ce5f5"] { color: var(--accent) !important; }
    .v-terminal.neo [style*="color:#ffffff"], .v-terminal.neo [style*="color:#dcd7f8"] { color: var(--text) !important; }
    .v-terminal.neo [style*="color:#b8b0e8"] { color: var(--muted) !important; }

    /* Typography primitives */
    .neo-title { font-size: 18px; font-weight: 400; letter-spacing: -0.01em; color: var(--text); line-height: 1.3; }
    .neo-meta, .neo-help { font-size: 11px; font-weight: 100; line-height: 15px; color: var(--muted); }
    .neo-meta em, .neo-help em { font-style: normal; font-weight: 400; color: var(--accent); }
    .neo-label { font-size: 8px; font-weight: 100; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
    .neo-num { font-size: 30px; font-weight: 200; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); }

    /* 1) Tactical Window Frame — 1px glow double-shell border */
    .neo-window, .neo-kpi,
    .v-terminal.neo .term-panel, .v-terminal.neo .term-card, .v-terminal.neo .term-inspector,
    .v-terminal.neo .term-kpi-strip, .v-terminal.neo details.craft-disclosure {
      background: linear-gradient(var(--color-pannel-dark), var(--color-pannel-dark)) padding-box, var(--gradient-window-glow) border-box;
      border: 1px solid transparent;
      border-radius: 6px;
      box-shadow: none;
    }
    .v-terminal.neo .term-panel, .v-terminal.neo .term-card, .v-terminal.neo .term-inspector { padding: 20px; }
    .neo-window { display: flex; flex-direction: column; min-width: 0; }
    .neo-win-head, .v-terminal.neo .cw-section-head {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0 12px 0 14px;
      background: linear-gradient(90deg, rgba(var(--color-accent-code), 0.26) 0%, rgba(var(--color-accent-code), 0.04) 100%) left bottom / 100% 1px no-repeat, var(--color-card-dark);
      border: 0;
      border-radius: 5px 5px 0 0;
      flex-shrink: 0;
    }
    .v-terminal.neo .cw-section-head { margin: -20px -20px 18px; }
    .neo-win-title, .v-terminal.neo .cw-section-title {
      font-size: 14px; font-weight: 400; color: var(--text); margin-right: auto; letter-spacing: -0.005em;
      display: inline-flex; align-items: center; gap: 10px; min-width: 0;
    }
    .v-terminal.neo .cw-section-title svg { display: none; }
    .neo-grid-ico, .v-terminal.neo .cw-section-title::before {
      content: "";
      width: 12px; height: 12px; flex-shrink: 0;
      color: var(--muted);
      background: radial-gradient(circle, currentColor 1px, transparent 1.4px) 0 0 / 4px 4px;
      transition: color 200ms ease-out;
    }
    .neo-win-head:hover .neo-grid-ico,
    .v-terminal.neo .cw-section-head:hover .cw-section-title::before { color: var(--color-accent); }
    .neo-win-dots, .v-terminal.neo .cw-section-head::after {
      content: "";
      width: 16px; height: 4px; flex-shrink: 0; margin-left: 2px;
      background: radial-gradient(circle, var(--muted) 1.2px, transparent 1.6px) 0 0 / 6px 4px repeat-x;
      opacity: 0.75;
    }
    .neo-win-body { padding: 20px; min-width: 0; }

    /* 2) Hollow-to-Solid Action Button */
    .v-terminal.neo .term-btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      height: 30px;
      padding: 0 18px;
      border-radius: 15px;
      border: 1px solid transparent;
      background: linear-gradient(rgba(var(--color-background-code), 0.75), rgba(var(--color-background-code), 0.75)) padding-box, var(--gradient-action-btn) border-box;
      color: var(--color-accent);
      font-size: 13px;
      font-weight: 400;
      justify-content: center;
      cursor: pointer;
      transition: color 300ms ease-out, transform 130ms ease-out;
    }
    :root[data-theme="light"] .v-terminal.neo .term-btn { color: var(--accent); }
    .v-terminal.neo .term-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--gradient-action-btn);
      opacity: 0;
      transition: opacity 300ms ease-out;
    }
    .v-terminal.neo .term-btn svg { stroke-width: 1.6; }
    @media (hover: hover) and (pointer: fine) {
      .v-terminal.neo .term-btn:hover { color: var(--color-card-dark); border-color: transparent; background: linear-gradient(rgba(var(--color-background-code), 0.75), rgba(var(--color-background-code), 0.75)) padding-box, var(--gradient-action-btn) border-box; }
      :root[data-theme="light"] .v-terminal.neo .term-btn:hover { color: #ffffff; }
      .v-terminal.neo .term-btn:hover::before { opacity: 1; }
    }
    .v-terminal.neo .term-btn:active { transform: scale(0.97); }
    .v-terminal.neo .term-btn:focus-visible { outline: 1px solid var(--color-accent); outline-offset: 2px; }
    .v-terminal.neo .term-btn-primary { min-width: 200px; }

    /* 3) Minimal Pill Input Fields */
    .v-terminal.neo .term-input, .v-terminal.neo .term-select {
      height: 28px;
      border-radius: 14px;
      border: 0;
      padding: 0 20px;
      background: rgba(var(--color-background-code), 0.75);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      outline: none;
      box-shadow: 0 0 0 1px transparent;
      transition: box-shadow 200ms ease-out;
    }
    .v-terminal.neo .term-input::placeholder { color: var(--muted); font-weight: 100; }
    @media (hover: hover) and (pointer: fine) {
      .v-terminal.neo .term-input:hover, .v-terminal.neo .term-select:hover { box-shadow: 0 0 0 1px rgba(var(--color-accent-code), 0.5); }
    }
    .v-terminal.neo .term-input:focus, .v-terminal.neo .term-select:focus { box-shadow: 0 0 0 1px var(--color-accent); }

    /* Key-value tables → top-label tactical fields */
    .v-terminal.neo .cw-prop-table { background: rgba(var(--color-card-code), 0.5); border: 1px solid var(--border); border-radius: 4px; }
    .v-terminal.neo .cw-prop-row { grid-template-columns: 1fr; border-bottom: 1px solid var(--rule); }
    .v-terminal.neo .cw-prop-key {
      background: transparent; border: 0; padding: 12px 16px 2px;
      font-size: 8px; font-weight: 100; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function triggerHaptic(pattern = 12) {
      try {
        if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
          navigator.vibrate(pattern);
        }
      } catch (_) {}
    }

    function showToast(title, desc) {
      triggerHaptic(10);
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const item = document.createElement('div');
      item.className = 'toast-item';
      item.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;">
          <span style="font-weight:600;color:#ffffff;">${title}</span>
          <span class="mono" style="font-size:11px;color:#8e8e96;">NOW</span>
        </div>
        <div style="font-size:13px;color:#b8b8c0;line-height:1.4;">${desc}</div>
      `;
      stack.appendChild(item);
      setTimeout(() => {
        item.classList.add('is-leaving');
        setTimeout(() => item.remove(), 200);
      }, 3200);
    }

    function formatTTL(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function pillClassForSeverity(sev) {
      const u = String(sev || '').toUpperCase();
      if (u.includes('CRITICAL') || u.includes('HIGH') || u.includes('BLOCKED') || u.includes('차단')) return 'pill pill-neg';
      if (u.includes('WATCH') || u.includes('MEDIUM') || u.includes('관찰')) return 'pill pill-warn';
      if (u.includes('LOW') || u.includes('NORMAL') || u.includes('ALLOWED') || u.includes('승인') || u.includes('허용')) return 'pill pill-pos';
      return 'pill pill-neu';
    }

    function bindTopologyInteractions() {
      const vp = document.getElementById('topo-viewport');
      if (!vp) return;
      let dragging = false;
      let startX = 0;
      let startY = 0;

      vp.onwheel = function(e) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.12 : -0.12;
        window.zoomTopology(delta);
      };

      vp.onpointerdown = function(e) {
        if (e.target.closest('button')) return;
        dragging = true;
        vp.classList.add('is-dragging');
        try { vp.setPointerCapture(e.pointerId); } catch (_) {}
        startX = e.clientX - state.topoPanX;
        startY = e.clientY - state.topoPanY;
      };

      vp.onpointermove = function(e) {
        if (!dragging) return;
        state.topoPanX = e.clientX - startX;
        state.topoPanY = e.clientY - startY;
        const g = document.getElementById('topo-svg-group');
        if (g) {
          g.setAttribute('transform', `translate(${state.topoPanX}, ${state.topoPanY}) scale(${state.topoZoom})`);
        }
      };

      const endTopoDrag = function(e) {
        if (!dragging) return;
        dragging = false;
        vp.classList.remove('is-dragging');
        try { vp.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      vp.onpointerup = endTopoDrag;
      vp.onpointercancel = endTopoDrag;
    }

                    <div style="width:100%;height:${hPct}%;background:${barColor};border-radius:4px;opacity:${isPeak ? '1' : '0.78'};"></div>
                  </div>

    /* =========================================================================

       ========================================================================= */
    window.setNeoTheme = function(theme) {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      if (current === theme) return;
      if (theme === 'light') root.setAttribute('data-theme', 'light');
      else root.removeAttribute('data-theme');
      // let the indicator slide first, then re-render theme-aware SVGs
      setTimeout(() => renderStage({ animate: false }), 320);
    };

    function renderVariantTerminal() {
      const inc = getSelectedIncident();
      const wUser = state.watchUsers[0];
      const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      const cfg = {

      } else if (state.page === 'active_incidents') {

      return `
        <div class="v-ledger">

          <!-- Centered 1180px Single-Column Document Stage -->

    /* =========================================================================
       9. MASTER STAGE RENDERER & PICKER.MD WIRING
       ========================================================================= */
    const stage = document.getElementById('stage');
    let lastLedgerIndicator = { left: 0, width: 56, ready: false };

    function syncLedgerNavIndicator() {
      const nav = document.getElementById('ledger-top-nav');
      const ind = document.getElementById('ledger-nav-indicator');
      if (!nav || !ind) return;
      const activeBtn = nav.querySelector('.ledger-nav-link.active');
      if (!activeBtn) return;
      const nr = nav.getBoundingClientRect();
      const br = activeBtn.getBoundingClientRect();
      const targetLeft = br.left - nr.left;
      const targetWidth = br.width;

      if (lastLedgerIndicator.ready) {
        ind.style.transition = 'none';
        ind.style.width = lastLedgerIndicator.width + 'px';
        ind.style.transform = `translateX(${lastLedgerIndicator.left}px)`;
        void ind.offsetWidth;
        ind.style.transition = '';
      }
      ind.style.width = targetWidth + 'px';
      ind.style.transform = `translateX(${targetLeft}px)`;
      lastLedgerIndicator = { left: targetLeft, width: targetWidth, ready: true };
    }

    function renderStage({ animate = true } = {}) {
      if (!stage) return;
      if (state.variant === 1) {
        stage.innerHTML = renderVariantTerminal();
      } else if (state.variant === 2) {
        stage.innerHTML = renderVariantSheet();
      } else if (state.variant === 3) {
        stage.innerHTML = renderVariantOled();
      } else {
        stage.innerHTML = renderVariantLedger();
      }
      const rootNode = stage.firstElementChild;
      if (rootNode && animate) {
        rootNode.classList.add('stage-animate');
      }
      bindTopologyInteractions();
      syncLedgerNavIndicator();
    }

    // Live TTL Countdown Ticker (Updates DOM nodes with data-ttl-display without re-rendering inputs)
    setInterval(() => {
      if (state.ttlSeconds > 0) state.ttlSeconds--;
      const formatted = formatTTL(state.ttlSeconds);
      document.querySelectorAll('[data-ttl-display]').forEach(el => {
        el.textContent = el.textContent.includes('남음') ? `${formatted} 남음` : formatted;
      });
    }, 1000);

    // Verbatim Picker Wiring (PICKER.md)
    const picker = document.querySelector('.proto-picker');
    const tabs = [...picker.querySelectorAll('.proto-picker__tab')];
    const hi = picker.querySelector('.proto-picker__hi');

    function moveHighlight(tab) {
      const pr = picker.getBoundingClientRect();
      const tr = tab.getBoundingClientRect();
      hi.style.width = tr.width + 'px';
      hi.style.transform = `translateX(${tr.left - pr.left - 4}px)`;
    }

    function select(v, { pushUrl = true, animate = true } = {}) {
      const idx = Math.max(1, Math.min(tabs.length, Number(v) || 1));
      const tab = tabs[idx - 1];
      tabs.forEach(t => t.setAttribute('aria-pressed', String(t === tab)));
      moveHighlight(tab);

      state.variant = idx;
      renderStage({ animate });

      if (pushUrl) {
        const url = new URL(location.href);
        url.searchParams.set('v', String(idx));
        history.replaceState(null, '', url);
      }
    }

    function replay() {
      const node = stage.firstElementChild;
      if (!node) return;
      node.classList.remove('stage-animate');
      void node.offsetWidth; // reflow
      node.classList.add('stage-animate');
    }

    tabs.forEach(t => t.addEventListener('click', () => select(t.dataset.v, { animate: true })));
    picker.querySelector('[data-act="replay"]')?.addEventListener('click', replay);
    const minBtn = document.getElementById('picker-min-btn');
    function togglePickerMinimize() {
      const minimized = picker.classList.toggle('is-minimized');
      if (minBtn) {
        minBtn.textContent = minimized ? '▴ 시안 피커' : '▾';
        minBtn.title = minimized ? '시안 선택기 펼치기 (H)' : '피커 바 접기 (H)';
      }
      if (!minimized) {
        const cur = tabs.find(t => t.getAttribute('aria-pressed') === 'true');
        if (cur) moveHighlight(cur);
      }
    }
    minBtn?.addEventListener('click', togglePickerMinimize);

    // Break-UI Dev Dataset Toggle (Demo -> Worst-Case -> Empty -> Demo)
    const DEMO_SNAPSHOT = JSON.parse(JSON.stringify({
      watchUsers: state.watchUsers,
      incidents: state.incidents,
      govAssets: state.govAssets,
      siteAccessGroups: state.siteAccessGroups,
      pipelineLogs: state.pipelineLogs
    }));
    state.dataMode = 'demo'; // 'demo' | 'worst' | 'empty'

    window.setDataMode = function(mode) {
      state.dataMode = mode;
      const btn = document.getElementById('picker-data-btn');
      if (mode === 'demo') {
        state.watchUsers = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.watchUsers));
        state.incidents = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.incidents));
        state.govAssets = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.govAssets));
        state.siteAccessGroups = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.siteAccessGroups));
        state.pipelineLogs = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.pipelineLogs));
        state.govSearch = '';
        state.siteSearch = '';
        state.pipeIpFilter = 'ALL';
        state.pipeTypeFilter = 'ALL';
        if (btn) btn.textContent = 'Data: Demo';
      } else if (mode === 'worst') {
        state.watchUsers = [{
          user: 'Aleksandra_Wiśniewska-Kowalczyk_SecOps_Lead',
          dept: '글로벌전략기획·클라우드거버넌스합동본부 · 장기파견계정',
          host: 'WKSTN-NORTHWIND-HOLDINGS-099812 (192.168.254.253)',
          score: 99,
          status: 'WATCH',
          ttlRemain: '29분 59초',
          reason: 'bartholomew.fitzgerald@northwind-industries-holdings.example.com 계정으로 https://sub.department.region.enterprise-llm-gateway-proxy.example.co.uk/v1/workspaces/q4-board-deck/upload?token=9f8e7d6c-5b4a-4c3d-8e2f-1a0b9c8d7e6f 장문 URL 호출 감지'
        }];
        state.incidents = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.incidents));
        state.incidents[0].title = '[극단적 장문 시나리오] Aleksandra Wiśniewska-Kowalczyk 계정의 Q3_Board_Deck_FINAL_revised_v12_[approved_by_legal].pdf 및 연속 무공백 도메인 반출 시도';
        state.incidents[0].source = 'bartholomew.fitzgerald@northwind-industries-holdings.example.com · WKSTN-NORTHWIND-01';
        state.incidents[0].target = 'https://sub.department.region.enterprise-llm-gateway-proxy.example.co.uk/v1/chat/completions';
        state.govAssets = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.govAssets));
        state.govAssets[0].domain = 'sub.department.region.enterprise-llm-gateway-proxy.example.co.uk';
        state.govAssets[0].service = 'Northwind Enterprise Multi-Region Unbreakable AI Gateway Service';
        state.govAssets[0].liveHits = 99999;
        state.govAssets[0].totalCumulative = 1284920;
        state.siteAccessGroups = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.siteAccessGroups));
        state.siteAccessGroups[0].domain = 'sub.department.region.enterprise-llm-gateway-proxy.example.co.uk';
        state.siteAccessGroups[0].lastDetail = 'Q3_Board_Deck_FINAL_revised_v12_[approved_by_legal]_IMG_20250914_183022_HDR.pdf (99,999 KB) 차단';
        state.pipelineLogs = JSON.parse(JSON.stringify(DEMO_SNAPSHOT.pipelineLogs));
        state.pipelineLogs[0].fileName = 'Q3_Board_Deck_FINAL_revised_v12_[approved_by_legal]_IMG_20250914_183022.pdf';
        state.pipelineLogs[0].pasteChars = 999999;
        state.govSearch = '';
        state.siteSearch = '';
        if (btn) btn.textContent = 'Data: Worst';
      } else if (mode === 'empty') {
        state.govSearch = '__NO_MATCH_ZERO_RESULT_QUERY__';
        state.siteSearch = '__NO_MATCH_ZERO_RESULT_QUERY__';
        state.pipeIpFilter = '192.168.10.64';
        state.pipeTypeFilter = 'SSH_BRUTE_PIVOT';
        if (btn) btn.textContent = 'Data: 0건';
      }
      renderStage({ animate: false });
    };

    picker.querySelector('[data-act="dataset"]')?.addEventListener('click', () => {
      const order = ['demo', 'worst', 'empty'];
      const next = order[(order.indexOf(state.dataMode) + 1) % order.length];
      window.setDataMode(next);
      showToast(`데이터 검증 모드: ${next.toUpperCase()}`, next === 'worst' ? '최악 장문·극단치 스트레스 데이터가 주입되었습니다.' : (next === 'empty' ? '0건 빈 결과(Empty State) 복구 UI를 표시합니다.' : '기본 데모 데이터로 복원되었습니다.'));
    });

    addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('gemini-modal');
        if (modal && modal.classList.contains('open')) {
          window.closeGeminiModal();
          return;
        }
      }
      if (e.target.matches('input, textarea, select, [contenteditable]')) return;
      // Never animate keyboard-initiated variant switches (100+/day action gate per animate/SKILL.md)
      if (e.key >= '1' && e.key <= String(tabs.length)) select(Number(e.key), { animate: false });
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const cur = tabs.findIndex(t => t.getAttribute('aria-pressed') === 'true');
        const next = (cur + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
        select(next + 1, { animate: false });
      } else if (e.key === 'r' || e.key === 'R') replay();
      else if (e.key === 'h' || e.key === 'H') togglePickerMinimize();
    });

    addEventListener('resize', () => {
      const cur = tabs.find(t => t.getAttribute('aria-pressed') === 'true');
      if (cur) moveHighlight(cur);
    });

    // Sync mobile status bar theme-color per active variant header background
    const VARIANT_THEME_COLORS = { 1: '#081217', 2: '#f4f6f8', 3: '#000000', 4: '#08080a' };
    const origSelect = select;
    select = function(v, opts = {}) {
      origSelect(v, opts);
      const bgHex = VARIANT_THEME_COLORS[state.variant] || '#08080a';
      document.documentElement.style.backgroundColor = bgHex;
      document.body.style.backgroundColor = bgHex;
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) {
        metaTheme.setAttribute('content', bgHex);
      }
      triggerHaptic(8);
    };

    // Native Bottom-Sheet Drag-to-Dismiss with rubber-banding & velocity handoff (apple-design §2, §5)
    (function initBottomSheetGesture() {
      const dialog = document.getElementById('gemini-modal-dialog');
      const backdrop = document.getElementById('gemini-modal');
      if (!dialog || !backdrop) return;
      let startY = 0;
      let lastY = 0;
      let lastT = 0;
      let velocityY = 0;
      let active = false;

      dialog.addEventListener('pointerdown', (e) => {
        if (e.target.matches('input, button, select, label, .switch-slider')) return;
        active = true;
        startY = lastY = e.clientY;
        lastT = performance.now();
        velocityY = 0;
        dialog.style.transition = 'none';
        try { dialog.setPointerCapture(e.pointerId); } catch (_) {}
      });

      dialog.addEventListener('pointermove', (e) => {
        if (!active) return;
        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        const rawDy = e.clientY - startY;
        velocityY = (e.clientY - lastY) / dt; // px/ms
        lastY = e.clientY;
        lastT = now;
        // Rubber-band resistance when pulling upward (rawDy < 0)
        const dampedDy = rawDy < 0 ? rawDy * 0.22 : rawDy;
        dialog.style.transform = `translateY(${dampedDy}px)`;
      });

      const finishSheetDrag = (e) => {
        if (!active) return;
        active = false;
        dialog.style.transition = '';
        const totalDy = e.clientY - startY;
        // Momentum projection: dismiss if dragged > 76px OR flicked downward with velocity > 0.55px/ms
        if (totalDy > 76 || (totalDy > 24 && velocityY > 0.55)) {
          triggerHaptic(14);
          dialog.style.transform = '';
          window.closeGeminiModal();
        } else {
          dialog.style.transform = '';
        }
      };
      dialog.addEventListener('pointerup', finishSheetDrag);
      dialog.addEventListener('pointercancel', finishSheetDrag);
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) window.closeGeminiModal();
      });
    })();

    // Native Pull-to-Refresh Sync Gesture at top of scroll container
    (function initPullToRefresh() {
      const ptr = document.getElementById('ptr-indicator');
      if (!ptr) return;
      let startY = 0;
      let pulling = false;
      let pullDist = 0;

      window.addEventListener('touchstart', (e) => {
        if (window.scrollY <= 0 && e.touches.length === 1) {
          startY = e.touches[0].clientY;
          pulling = true;
          pullDist = 0;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 8 && window.scrollY <= 0) {
          pullDist = Math.min(88, dy * 0.45);
          ptr.classList.add('is-pulling');
          ptr.style.opacity = String(Math.min(1, pullDist / 54));
          ptr.style.transform = `translate3d(-50%, ${pullDist - 40}px, 0) scale(${0.94 + Math.min(0.06, pullDist / 900)})`;
          ptr.textContent = pullDist >= 56 ? '손을 떼면 Railway 최신 로그 동기화' : '당겨서 Railway 최신 로그 동기화';
        }
      }, { passive: true });

      const endPull = () => {
        if (!pulling) return;
        pulling = false;
        ptr.classList.remove('is-pulling');
        if (pullDist >= 56) {
          triggerHaptic([12, 30, 16]);
          window.syncRailwayLogs();
        }
        ptr.style.opacity = '0';
        ptr.style.transform = 'translate3d(-50%, -60px, 0) scale(0.92)';
        pullDist = 0;
      };
      window.addEventListener('touchend', endPull, { passive: true });
      window.addEventListener('touchcancel', endPull, { passive: true });
    })();

    const initialData = new URL(location.href).searchParams.get('data');
    if (initialData === 'worst' || initialData === 'empty') {
      window.setDataMode(initialData);
    }
    const initial = new URL(location.href).searchParams.get('v') || '1';
    select(initial, { pushUrl: false, animate: false });
  </script>
