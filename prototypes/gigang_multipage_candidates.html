<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" id="meta-theme-color" content="#08080a" />
  <meta name="color-scheme" content="dark light" />
  <title>GIGANG | Zero Trust 통합 보안 관제 &amp; Shadow AI 거버넌스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       1. RESET & GLOBAL CRAFT FLOOR (Golden Design Suite + App-Screens Rules)
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #08080a;
      color: #f4f4f6;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    .mono {
      font-family: "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
    }
    .num, th.num, td.num {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
    }
    .unit-suffix {
      font-size: 0.68em;
      font-weight: 400;
      opacity: 0.72;
      margin-left: 3px;
    }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    :root {
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    button, a, [role="button"], .switch-toggle, .proto-picker__tab, .proto-picker__act, .sheet-drag-handle {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    button {
      cursor: pointer;
      transition: transform 130ms var(--ease-out),
                  background-color 150ms ease,
                  border-color 150ms ease,
                  color 150ms ease,
                  opacity 150ms ease;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }
    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #2f70bb;
      outline-offset: 2px;
    }
    ::selection {
      background: rgba(74, 138, 214, 0.24);
    }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    table.data-table th {
      font-size: 12px;
      font-weight: 500;
      padding: 10px 12px;
      white-space: nowrap;
      user-select: none;
    }
    table.data-table th.sortable {
      cursor: pointer;
    }
    table.data-table td {
      padding: 10px 12px;
      vertical-align: middle;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    td.col-id, td.col-time, td.col-score {
      white-space: nowrap;
    }
    /* Interactive table row left-bar & focus/hover affordance */
    tr.interactive-row {
      transition: background-color 140ms ease;
    }
    tr.interactive-row td:first-child {
      position: relative;
    }
    tr.interactive-row:hover td {
      background-color: rgba(128, 128, 140, 0.08);
    }
    /* Collapsible Floating Picker Dock (Zero Bottom Content Occlusion) */
    .proto-picker {
      transition: transform 220ms var(--ease-out), opacity 180ms var(--ease-out);
    }
    .proto-picker.is-minimized .proto-picker__tab,
    .proto-picker.is-minimized .proto-picker__sep,
    .proto-picker.is-minimized [data-act="dataset"],
    .proto-picker.is-minimized [data-act="replay"],
    .proto-picker.is-minimized .proto-picker__hi {
      display: none !important;
    }
    /* Subtle 3-Hop SVG Node Selection Ring */
    .hop-node-group {
      cursor: pointer;
    }
    .hop-node-group rect.hop-card-box {
      transition: stroke-width 150ms ease, stroke 150ms ease;
    }
    .hop-node-group.is-active-hop rect.hop-card-box {
      stroke-width: 2.4px;
    }
    .grid-4col > *, .grid-2col > *, .grid-2-1 > *, .term-workbench > *, .ledger-kpi-row > *,
    .term-kpi-cell, .sheet-kpi-cell, .oled-well, .oled-card, .term-panel, .sheet-card, .ledger-card {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .pill, .status-pill {
      flex-shrink: 0;
    }
    .switch-toggle input:focus-visible + .switch-slider {
      outline: 2px solid #5e9eff;
      outline-offset: 2px;
    }
    .empty-state-box {
      padding: 28px 18px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--ground);
      color: var(--muted);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    table.data-table th.num,
    table.data-table td.num {
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* Status Pills (Pale tint + high-contrast text per app-screens.md §7.6) */
    .status-pill,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex: none;
      font-variant-numeric: tabular-nums;
    }
    .pill-pos { background: var(--pill-pos-bg); color: var(--pill-pos-ink); }
    .pill-neg { background: var(--pill-neg-bg); color: var(--pill-neg-ink); }
    .pill-warn { background: var(--pill-warn-bg); color: var(--pill-warn-ink); }
    .pill-neu { background: var(--pill-neu-bg); color: var(--pill-neu-ink); }
    .dot-ind {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* =========================================================================
       2. THE PICKER (Verbatim from concept-design-pack/skills/prototype/PICKER.md)
       ========================================================================= */
    .proto-picker {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker__hi {
      position: absolute;
      top: 4px;
      left: 4px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      will-change: transform, width;
      transition:
        transform 240ms cubic-bezier(0.23, 1, 0.32, 1),
        width 240ms cubic-bezier(0.23, 1, 0.32, 1);
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker__hi { transition: none; }
    }
    .proto-picker__tab,
    .proto-picker__act {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
      white-space: nowrap;
    }
    .proto-picker__tab:hover,
    .proto-picker__act:hover {
      color: rgba(255, 255, 255, 0.92);
    }
    .proto-picker__tab[aria-pressed="true"] {
      color: #ffffff;
      font-weight: 600;
    }
    .proto-picker__num {
      font-family: var(--font-mono);
      font-size: 11px;
      opacity: 0.72;
    }
    .proto-picker__sep {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.14);
    }

    /* =========================================================================
       3. VARIANT 1: DATA TERMINAL (Dark · 56px Icon Rail + Split Master-Detail)
       ========================================================================= */
    .v-terminal {
      --ground: #171719;
      --surface: #131217;
      --raised: #212023;
      --border: #242428;
      --rule: #1d1c21;
      --control: #3a3a3e;
      --text: #ffffff;
      --muted: #9a9ca2;
      --faint: #8a8c92;
      --accent: #4a8ad6;
      --positive: #5fc39c;
      --negative: #e5566f;
      --warning: #d9a441;
      --pill-pos-bg: #1b2828; --pill-pos-ink: #5fc39c;
      --pill-neg-bg: #2c1a20; --pill-neg-ink: #ff7a90;
      --pill-warn-bg: #2a2416; --pill-warn-ink: #ebc06d;
      --pill-neu-bg: #212023; --pill-neu-ink: #c8c8cc;
      background: var(--ground);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
    }
    .v-terminal .term-rail {
      width: 92px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 18px;
      flex-shrink: 0;
      gap: 6px;
    }
    .v-terminal .term-rail-logo {
      width: 48px;
      height: 36px;
      border-radius: 6px;
      background: var(--raised);
      border: 1px solid var(--control);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .v-terminal .term-rail-btn {
      width: 62px;
      padding: 8px 4px;
      white-space: nowrap;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      position: relative;
    }
    .v-terminal .term-rail-label {
      font-size: 11px;
      font-weight: 500;
      color: inherit;
      line-height: 1.2;
    }
    .v-terminal .term-rail-btn:hover {
      color: var(--text);
      background: var(--raised);
    }
    .v-terminal .term-rail-btn.active {
      color: var(--text);
      background: var(--raised);
      border-color: var(--control);
    }
    .v-terminal .rail-brand {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: var(--raised);
      border: 1px solid var(--control);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .v-terminal .rail-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      align-items: center;
    }
    .v-terminal .rail-btn {
      width: 40px;
      height: 38px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .v-terminal .rail-btn:hover {
      color: var(--text);
      background: var(--raised);
    }
    .v-terminal .rail-btn.active {
      color: var(--text);
      background: var(--raised);
    }
    .v-terminal .rail-btn.active::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--accent);
    }
    .v-terminal .term-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .v-terminal .term-topbar {
      height: 44px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
    }
    .v-terminal .term-canvas {
      padding: 24px 28px 116px;
      flex: 1;
    }
    .v-terminal .term-title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .v-terminal h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .v-terminal .term-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .v-terminal .term-tab-strip {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .v-terminal .term-tab {
      background: none;
      border: none;
      padding: 8px 0 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 1px solid transparent;
      margin-bottom: -1px;
    }
    .v-terminal .term-tab.active {
      color: var(--text);
      border-bottom: 1px solid var(--accent);
    }
    .v-terminal .term-workbench {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
      align-items: stretch;
    }
    .v-terminal .term-card,
    .v-terminal .term-panel,
    .v-terminal .term-inspector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }
    .v-terminal .term-kpi-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .v-terminal .term-kpi-val {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .v-terminal .term-kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .v-terminal .term-kpi-cell {
      padding: 14px 16px;
      border-right: 1px solid var(--border);
    }
    .v-terminal .term-kpi-cell:last-child {
      border-right: none;
    }
    .v-terminal .kpi-lbl {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .v-terminal .kpi-val {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .v-terminal .kpi-delta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .v-terminal .term-btn {
      height: 32px;
      white-space: nowrap;
      padding: 0 12px;
      border-radius: 4px;
      border: 1px solid var(--control);
      background: var(--raised);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .v-terminal .term-btn:hover {
      border-color: var(--accent);
    }
    .v-terminal .term-btn-primary {
      background: var(--text);
      color: #111113;
      border-color: var(--text);
      font-weight: 600;
    }
    .v-terminal .term-input, .v-terminal .term-select {
      height: 32px;
      padding: 0 10px;
      border-radius: 4px;
      border: 1px solid var(--control);
      background: var(--ground);
      color: var(--text);
      font-size: 13px;
    }
    .v-terminal table.data-table th {
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .v-terminal table.data-table td {
      border-bottom: 1px solid var(--rule);
      color: var(--text);
    }
    .v-terminal table.data-table tr.selected-row td {
      background: var(--raised);
    }
    .v-terminal table.data-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* =========================================================================
       4. VARIANT 2: FRAMED SHEET (Light · Tinted L-Frame #f4f6f8 + White Sheet)
       ========================================================================= */
    .v-sheet {
      --ground: #f4f6f8;
      --surface: #ffffff;
      --raised: #f8fafb;
      --active: #e9ecef;
      --border: #e5e8eb;
      --rule: #eff1f3;
      --control: #cbd0d6;
      --text: #131416;
      --muted: #55585c;
      --faint: #686b6f;
      --accent: #1b6c80;
      --positive: #1e7b4f;
      --negative: #c4242a;
      --warning: #92400e;
      --pill-pos-bg: #dcfae5; --pill-pos-ink: #04250e;
      --pill-neg-bg: #ffedea; --pill-neg-ink: #831c1e;
      --pill-warn-bg: #fffbeb; --pill-warn-ink: #92400e;
      --pill-neu-bg: #ebedee; --pill-neu-ink: #353736;
      background: var(--ground);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .v-sheet .sheet-topbar {
      height: 48px;
      background: var(--ground);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .v-sheet .sheet-body {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 48px);
    }
    .v-sheet .sheet-sidebar {
      width: 236px;
      background: var(--ground);
      padding: 8px 18px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .v-sheet .sheet-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      margin-bottom: 2px;
    }
    .v-sheet .sheet-nav-item:hover {
      color: var(--text);
      background: rgba(0, 0, 0, 0.04);
    }
    .v-sheet .sheet-nav-item.active {
      background: var(--active);
      color: var(--text);
      font-weight: 600;
    }
    .v-sheet .sheet-stage {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin: 0 8px 8px 0;
      padding: 24px 28px 116px;
    }
    .v-sheet h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.015em;
    }
    .v-sheet .sheet-tray {
      background: var(--ground);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .v-sheet .sheet-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .v-sheet .sheet-kpi-cell {
      padding: 14px 16px;
      border-right: 1px solid var(--border);
    }
    .v-sheet .sheet-kpi-cell:last-child {
      border-right: none;
    }
    .v-sheet .sheet-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .v-sheet .sheet-btn {
      height: 32px;
      white-space: nowrap;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--control);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .v-sheet .sheet-btn-primary {
      background: #131416;
      color: #ffffff;
      border-color: #131416;
    }
    .v-sheet .sheet-input, .v-sheet .sheet-select {
      height: 32px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--control);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
    }
    .v-sheet table.data-table th {
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .v-sheet table.data-table td {
      border-bottom: 1px solid var(--rule);
      color: var(--text);
    }
    .v-sheet table.data-table tr:hover td {
      background: var(--raised);
    }

    /* =========================================================================
       5. VARIANT 3: TRUE-BLACK FLAT (Dark · #000000 Ruled T-Frame + 20px Soft)
       ========================================================================= */

    /* =========================================================================
       7. SHARED INTERACTIVE COMPONENTS (Toast, Modals, Toggle Switch, 3-Hop SVG)
       ========================================================================= */
    .switch-toggle {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .switch-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(128, 128, 128, 0.35);
      border-radius: 999px;
      transition: background-color 160ms ease;
    }
    .switch-slider::before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform 180ms var(--ease-out);
      will-change: transform;
    }
    .switch-toggle input:checked + .switch-slider {
      background-color: #247b50;
    }
    .switch-toggle.danger-switch input:checked + .switch-slider {
      background-color: #c4242a;
    }
    .switch-toggle input:checked + .switch-slider::before {
      transform: translateX(14px);
    }

    /* Non-blocking Sonner-style Toast Stack (CSS Transitions + @starting-style, zero keyframes) */
    .toast-stack {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 2147483640;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      min-width: 290px;
      max-width: 420px;
      background: #171719;
      color: #ffffff;
      border: 1px solid #343438;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out);
      will-change: transform, opacity;
    }
    @starting-style {
      .toast-item {
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
      }
    }
    .toast-item.is-leaving {
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
    }

    /* Modal Backdrop & Dialog (Smooth scale(0.96) -> scale(1), never scale(0)) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2147483630;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 200ms var(--ease-out), visibility 200ms var(--ease-out);
    }
    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .modal-dialog {
      background: #171719;
      color: #ffffff;
      border: 1px solid #343438;
      border-radius: 10px;
      width: 100%;
      max-width: 460px;
      padding: 20px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      transform: scale(0.96) translateY(6px);
      opacity: 0;
      transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out);
      will-change: transform, opacity;
    }
    .modal-backdrop.open .modal-dialog {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Stage & Staggered Card Entrance Choreography (Gated on pointer/replay, skipped on keyboard 1-4) */
    @keyframes stageFadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stage-animate .term-canvas > *,
    .stage-animate .sheet-stage > *,
    .stage-animate .oled-canvas > *,
    .stage-animate .ledger-main > * {
      animation: stageFadeUp 220ms var(--ease-out) both;
    }
    .stage-animate .term-canvas > *:nth-child(1),
    .stage-animate .sheet-stage > *:nth-child(1),
    .stage-animate .oled-canvas > *:nth-child(1),
    .stage-animate .ledger-main > *:nth-child(1) { animation-delay: 0ms; }
    .stage-animate .term-canvas > *:nth-child(2),
    .stage-animate .sheet-stage > *:nth-child(2),
    .stage-animate .oled-canvas > *:nth-child(2),
    .stage-animate .ledger-main > *:nth-child(2) { animation-delay: 35ms; }
    .stage-animate .term-canvas > *:nth-child(3),
    .stage-animate .sheet-stage > *:nth-child(3),
    .stage-animate .oled-canvas > *:nth-child(3),
    .stage-animate .ledger-main > *:nth-child(3) { animation-delay: 70ms; }
    .stage-animate .term-canvas > *:nth-child(4),
    .stage-animate .sheet-stage > *:nth-child(4),
    .stage-animate .oled-canvas > *:nth-child(4),
    .stage-animate .ledger-main > *:nth-child(4) { animation-delay: 105ms; }
    .stage-animate .term-canvas > *:nth-child(5),
    .stage-animate .sheet-stage > *:nth-child(5),
    .stage-animate .oled-canvas > *:nth-child(5),
    .stage-animate .ledger-main > *:nth-child(5) { animation-delay: 140ms; }

    /* Interactive 3-Hop SVG Smooth Zoom & Zero-Latency Drag */
    #topo-svg-group {
      transition: transform 200ms var(--ease-out);
      will-change: transform;
    }
    .topology-viewport.is-dragging #topo-svg-group {
      transition: none !important;
    }

    /* Sliding Top-Nav Indicator for Variant 4 (Black Achromatic Ledger) */
    .v-ledger .ledger-nav {
      position: relative;
    }
    .v-ledger .ledger-nav-link.active {
      border-bottom-color: transparent;
    }
    .ledger-nav-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--text);
      transition: transform 220ms var(--ease-out), width 220ms var(--ease-out);
      will-change: transform, width;
      pointer-events: none;
    }

    /* Pointer Hover Gating & Reduced Motion Accessibility */
    @media (hover: hover) and (pointer: fine) {
      .term-btn:hover, .sheet-btn:hover, .oled-btn:hover, .ledger-btn:hover {
        transform: translateY(-1px);
      }
      .term-btn:active, .sheet-btn:active, .oled-btn:active, .ledger-btn:active {
        transform: scale(0.97);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
      .toast-item,
      .modal-dialog,
      #topo-svg-group,
      .ledger-nav-indicator,
      .switch-slider::before {
        transition-duration: 120ms !important;
        transform: none !important;
      }
    }

    /* Interactive 3-Hop SVG Viewport */
    .topology-viewport {
      width: 100%;
      height: 250px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      border-radius: 6px;
    }
    .topology-viewport:active {
      cursor: grabbing;
    }
    .topology-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 5;
    }

    /* Mobile Drawer Navigation (Folds sidebar on <= 900px) */
    .mobile-menu-btn {
      display: none;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: stretch;
    }
    .grid-2-1 {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 20px;
      align-items: stretch;
    }
    .grid-4col {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    @media (max-width: 1024px) {
      .v-terminal .term-workbench,
      .grid-2col,
      .grid-2-1 {
        grid-template-columns: 1fr !important;
      }
      .v-terminal .term-kpi-strip,

      .v-ledger .ledger-kpi-row,
      .grid-4col {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    /* Pull-to-refresh tactile indicator */
    .ptr-indicator {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translate3d(-50%, -60px, 0) scale(0.92);
      z-index: 2147483645;
      background: #171719;
      color: #f4f4f6;
      border: 1px solid #34343c;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: transform 200ms var(--ease-out), opacity 180ms var(--ease-out);
      will-change: transform, opacity;
    }
    .ptr-indicator.is-pulling {
      transition: none;
    }
    .sheet-drag-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;
      background: #484852;
      margin: 0 auto 12px;
      cursor: grab;
      touch-action: none;
    }

    /* Coarse pointer (Touch Devices): 16px input font-size prevents iOS auto-zoom; 44px min touch targets */
    @media (pointer: coarse) {
      input, textarea, select {
        font-size: 16px !important;
      }
      .term-btn, .sheet-btn, .oled-btn, .ledger-btn,
      .term-select, .sheet-select, .oled-select, .ledger-select,
      .term-input, .sheet-input, .oled-input, .ledger-input,
      .ledger-nav-link, .sheet-nav-item, .oled-nav-item {
        min-height: 44px;
      }
      .proto-picker__tab, .proto-picker__act {
        min-height: 36px;
        min-width: 44px;
        justify-content: center;
      }
    }

    @media (max-width: 768px) {
      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }
      .modal-dialog {
        max-width: 100%;
        border-radius: 16px 16px 0 0;

        padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateY(100%);
      }
      .modal-backdrop.open .modal-dialog {
        transform: translateY(0);

        display: inline-flex !important;

      .v-terminal .term-canvas,

      }

      }

        max-width: calc(100vw - 40px);
        overflow-x: auto;
      }
      .proto-picker__name {
        display: none;
      }
    }
  </style>

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function triggerHaptic(pattern = 12) {
      try {
        if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
          navigator.vibrate(pattern);
        }
      } catch (_) {}
    }

    function showToast(title, desc) {
      triggerHaptic(10);
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const item = document.createElement('div');
      item.className = 'toast-item';
      item.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;">
          <span style="font-weight:600;color:#ffffff;">${title}</span>
          <span class="mono" style="font-size:11px;color:#8e8e96;">NOW</span>
        </div>
        <div style="font-size:13px;color:#b8b8c0;line-height:1.4;">${desc}</div>
      `;
      stack.appendChild(item);
      setTimeout(() => {
        item.classList.add('is-leaving');
        setTimeout(() => item.remove(), 200);
      }, 3200);
    }

    function formatTTL(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

      if (u.includes('CRITICAL') || u.includes('HIGH') || u.includes('BLOCKED') || u.includes('차단')) return 'pill pill-neg';
      if (u.includes('WATCH') || u.includes('MEDIUM') || u.includes('관찰')) return 'pill pill-warn';
      if (u.includes('LOW') || u.includes('NORMAL') || u.includes('ALLOWED') || u.includes('승인') || u.includes('허용')) return 'pill pill-pos';
      return 'pill pill-neu';

    function bindTopologyInteractions() {
      const vp = document.getElementById('topo-viewport');
      if (!vp) return;
      let dragging = false;
      let startX = 0;
      let startY = 0;

      vp.onwheel = function(e) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.12 : -0.12;
        window.zoomTopology(delta);
      };

      vp.onpointerdown = function(e) {
        if (e.target.closest('button')) return;
        dragging = true;
        vp.classList.add('is-dragging');
        try { vp.setPointerCapture(e.pointerId); } catch (_) {}
        startX = e.clientX - state.topoPanX;
        startY = e.clientY - state.topoPanY;
      };

      vp.onpointermove = function(e) {
        if (!dragging) return;
        state.topoPanX = e.clientX - startX;
        state.topoPanY = e.clientY - startY;
        const g = document.getElementById('topo-svg-group');
        if (g) {
          g.setAttribute('transform', `translate(${state.topoPanX}, ${state.topoPanY}) scale(${state.topoZoom})`);
        }
      };

      const endTopoDrag = function(e) {
        if (!dragging) return;
        dragging = false;
        vp.classList.remove('is-dragging');
        try { vp.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      vp.onpointerup = endTopoDrag;
      vp.onpointercancel = endTopoDrag;
    }

    function renderWeeklyBars(barColor, trackBg) {
      const maxVal = Math.max(...state.weeklyActivity.map(d => d.count), 1);
      const total = state.weeklyActivity.reduce((acc, d) => acc + d.count, 0);
      return `
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <div>
              <div style="font-size:13.5px;font-weight:600;">주간 보안 이벤트 추이 (Weekly Activity)</div>
              <div style="font-size:13px;color:var(--muted);">최근 7일 상관분석 탐지 추이 (Mon ~ Sun)</div>
            </div>
            <span class="pill pill-neu mono">주간 합계 ${total}건</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:10px;align-items:end;height:142px;padding-top:14px;">
            ${state.weeklyActivity.map(item => {
              const hPct = Math.max(14, Math.round((item.count / maxVal) * 86));
              return `
                <div style="display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;">
                  <span class="mono" style="font-size:11px;color:var(--muted);">${item.count}</span>
                  <div style="width:100%;max-width:34px;height:100px;background:${trackBg};border-radius:4px;display:flex;align-items:flex-end;overflow:hidden;">
                    <div style="width:100%;height:${hPct}%;background:${barColor};border-radius:3px;"></div>
                  </div>
                  <span class="mono" style="font-size:11px;color:var(--muted);">${item.day}</span>
                </div>
              `;
            }).join('')}
          </div>
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);">
            <span>최다 탐지: <strong class="mono" style="color:var(--text);">Fri (38건)</strong></span>
            <span>일평균: <strong class="mono" style="color:var(--text);">20.0건</strong></span>

        try { dialog.setPointerCapture(e.pointerId); } catch (_) {}
      });

      dialog.addEventListener('pointermove', (e) => {
        if (!active) return;
        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        const rawDy = e.clientY - startY;
        velocityY = (e.clientY - lastY) / dt; // px/ms
        lastY = e.clientY;
        lastT = now;
        // Rubber-band resistance when pulling upward (rawDy < 0)
        const dampedDy = rawDy < 0 ? rawDy * 0.22 : rawDy;
        dialog.style.transform = `translateY(${dampedDy}px)`;
      });

      const finishSheetDrag = (e) => {
        if (!active) return;
        active = false;
        dialog.style.transition = '';
        const totalDy = e.clientY - startY;
        // Momentum projection: dismiss if dragged > 76px OR flicked downward with velocity > 0.55px/ms
        if (totalDy > 76 || (totalDy > 24 && velocityY > 0.55)) {
          triggerHaptic(14);
          dialog.style.transform = '';
          window.closeGeminiModal();
        } else {
          dialog.style.transform = '';
        }
      };
      dialog.addEventListener('pointerup', finishSheetDrag);
      dialog.addEventListener('pointercancel', finishSheetDrag);
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) window.closeGeminiModal();
      });
    })();

    // Native Pull-to-Refresh Sync Gesture at top of scroll container
    (function initPullToRefresh() {
      const ptr = document.getElementById('ptr-indicator');
      if (!ptr) return;
      let startY = 0;
      let pulling = false;
      let pullDist = 0;

      window.addEventListener('touchstart', (e) => {
        if (window.scrollY <= 0 && e.touches.length === 1) {
          startY = e.touches[0].clientY;
          pulling = true;
          pullDist = 0;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 8 && window.scrollY <= 0) {
          pullDist = Math.min(88, dy * 0.45);
          ptr.classList.add('is-pulling');
          ptr.style.opacity = String(Math.min(1, pullDist / 54));
          ptr.style.transform = `translate3d(-50%, ${pullDist - 40}px, 0) scale(${0.94 + Math.min(0.06, pullDist / 900)})`;
          ptr.textContent = pullDist >= 56 ? '손을 떼면 Railway 최신 로그 동기화' : '당겨서 Railway 최신 로그 동기화';
        }
      }, { passive: true });

      const endPull = () => {
        if (!pulling) return;
        pulling = false;
        ptr.classList.remove('is-pulling');
        if (pullDist >= 56) {
          triggerHaptic([12, 30, 16]);
          window.syncRailwayLogs();
        }
        ptr.style.opacity = '0';
        ptr.style.transform = 'translate3d(-50%, -60px, 0) scale(0.92)';
        pullDist = 0;
      };
      window.addEventListener('touchend', endPull, { passive: true });
      window.addEventListener('touchcancel', endPull, { passive: true });
    })();

    const initialData = new URL(location.href).searchParams.get('data');
    if (initialData === 'worst' || initialData === 'empty') {
      window.setDataMode(initialData);
    }
    const initial = new URL(location.href).searchParams.get('v') || '4';
    select(initial, { pushUrl: false, animate: false });
  </script>
</body>
