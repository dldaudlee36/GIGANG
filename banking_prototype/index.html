<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OK저축은행">
  <title>OK저축은행</title>

  <style>
    /* ========== RESET & iOS NATIVE STYLING ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #F4F5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", Roboto, sans-serif;
      color: #191F28;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* iOS Safe Areas */
    .header-safe {
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .footer-safe {
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }

    /* Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ========== HEADER ========== */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #F4F5F8;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-container {
      display: flex;
      align-items: baseline;
      gap: 3px;
      cursor: pointer;
    }
    .logo-ok {
      font-size: 23px;
      font-weight: 900;
      color: #4A3E3D;
      letter-spacing: -0.5px;
    }
    .logo-excl {
      font-size: 23px;
      font-weight: 900;
      color: #F05A22;
      margin-left: 1px;
    }
    .logo-bank {
      font-size: 17px;
      font-weight: 700;
      color: #2B2D31;
      margin-left: 3px;
      letter-spacing: -0.3px;
    }
    .header-icons {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #333D4B;
    }
    .header-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-dot {
      position: absolute;
      top: 0;
      right: 0;
      width: 7px;
      height: 7px;
      background-color: #F05A22;
      border-radius: 50%;
    }

    /* ========== MAIN CONTAINER ========== */
    main {
      flex: 1;
      padding: 0 16px 120px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    main > * {
      flex-shrink: 0 !important;
    }

    /* User Greeting Row */
    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }
    .user-greeting {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #191F28;
    }
    .btn-att {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: 1px solid #E5E8EB;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #4E5968;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-att:active {
      transform: scale(0.96);
    }
    .btn-att.attended {
      background-color: #FFF2EE;
      border-color: #FFC9B6;
      color: #F05A22;
    }

    /* Banner */
    .banner-box {
      background-color: #FFF1EE;
      border-radius: 16px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #E25039;
      cursor: pointer;
    }
    .banner-box:active { opacity: 0.85; }

    /* Account Carousel */
    .carousel-container {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: visible;
      scroll-snap-type: x mandatory;
      padding: 6px 2px 14px 2px;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .card {
      background: #FFFFFF;
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.035);
      border: 1px solid #F0F2F5;
      scroll-snap-align: start;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .account-card {
      width: 82vw;
      max-width: 320px;
      height: 195px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .acc-content-top {
      display: flex;
      flex-direction: column;
      min-height: 86px;
    }
    .acc-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      height: 24px;
    }
    .acc-icon {
      width: 20px;
      height: 20px;
      background: #F05A22;
      border-radius: 6px;
      color: #FFF;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .acc-title {
      font-size: 14px;
      font-weight: 600;
      color: #333D4B;
      white-space: nowrap;
    }
    .acc-balance {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #191F28;
      margin-top: 4px;
      display: flex;
      align-items: baseline;
    }
    .acc-balance span.unit {
      font-size: 20px;
      font-weight: 700;
      margin-left: 3px;
    }
    .btn-orange {
      width: 100%;
      height: 48px;
      background: #F05A22;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(240, 90, 34, 0.28);
      transition: all 0.15s ease;
      margin-top: auto;
      flex-shrink: 0;
    }
    .btn-orange:active {
      background: #DE4D17;
      transform: scale(0.98);
    }

    /* Dark Mode Auto Support */
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #181A20 !important;
        color: #F9FAFB !important;
      }
      header {
        background: #181A20 !important;
      }
      .logo-ok { color: #FFFFFF !important; }
      .logo-bank { color: #E5E7EB !important; }
      .header-icons { color: #E5E7EB !important; }
      .card {
        background: #23262F !important;
        border-color: #2F333F !important;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25) !important;
      }
      .banner-box {
        background-color: #381E19 !important;
        color: #FF7B66 !important;
      }
      .user-greeting { color: #FFFFFF !important; }
      .btn-att {
        background: #23262F !important;
        border-color: #2F333F !important;
        color: #E5E7EB !important;
      }
      .acc-title { color: #D1D5DB !important; }
      .acc-balance { color: #FFFFFF !important; }
      .row-label { color: #E5E7EB !important; }
      .row-value { color: #FFFFFF !important; }
      .card-divider { background: #2F333F !important; }
      .roulette-title { color: #FFFFFF !important; }
      .rec-header h2 { color: #FFFFFF !important; }
      .rec-header p { color: #9CA3AF !important; }
      nav.tabbar {
        background: #1C1E24 !important;
        border-top-color: #2B2E38 !important;
      }
      .tab-btn { color: #828A99 !important; }
      .tab-btn.active { color: #FFFFFF !important; }
      .bottom-sheet { background: #23262F !important; color: #FFFFFF !important; }
      .dialog-card { background: #23262F !important; color: #FFFFFF !important; }
      .modal-title { color: #FFFFFF !important; }
      .input-field {
        background: #181A20 !important;
        border-color: #2F333F !important;
        color: #FFFFFF !important;
      }
      .tag-btn {
        background: #2F333F !important;
        color: #E5E7EB !important;
      }
    }

    /* Point / Coupon / Roulette Card */
    .info-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .row-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .point-badge {
      width: 22px;
      height: 22px;
      background: #FFB800;
      border-radius: 50%;
      color: white;
      font-weight: 900;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .row-label {
      font-size: 15px;
      font-weight: 600;
      color: #333D4B;
    }
    .row-value {
      font-size: 15px;
      font-weight: 800;
      color: #191F28;
    }
    .card-divider {
      height: 1px;
      background: #F2F4F6;
      border: none;
    }
    .roulette-promo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .roulette-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
      color: #191F28;
      margin-bottom: 10px;
    }
    .btn-roulette {
      background: #F05A22;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-roulette:active { transform: scale(0.95); }

    /* Recommendation Section */
    .rec-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .rec-header h2 {
      font-size: 17px;
      font-weight: 800;
      color: #191F28;
    }
    .rec-header p {
      font-size: 13px;
      color: #8B95A1;
      font-weight: 500;
      margin-top: 2px;
    }
    .invite-banner {
      background: linear-gradient(135deg, #F05A22 0%, #FF7A45 100%);
      border-radius: 18px;
      padding: 18px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(240, 90, 34, 0.22);
    }
    .invite-banner:active { transform: scale(0.98); }
    .invite-text h3 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .invite-text p {
      font-size: 13px;
      color: #FFE6DC;
      line-height: 1.35;
      font-weight: 500;
    }
    .invite-icon {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.22);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    /* ========== BOTTOM TAB BAR ========== */
    nav.tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-top: 1px solid #ECEEF0;
      z-index: 40;
    }
    .tabbar-inner {
      display: flex;
      height: 62px;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
    }
    .tab-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: #8B95A1;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #191F28;
      font-weight: 800;
    }
    .tab-btn svg {
      width: 23px;
      height: 23px;
    }

    /* ========== MODALS ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .bottom-sheet {
      width: 100%;
      max-width: 440px;
      background: white;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px 20px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.show .bottom-sheet {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 44px;
      height: 5px;
      background: #E5E8EB;
      border-radius: 999px;
      margin: -10px auto 16px auto;
    }
    .modal-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #8B95A1;
      cursor: pointer;
      padding: 4px;
    }
    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: #F8F9FA;
      border: 1px solid #E5E8EB;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #191F28;
      outline: none;
      margin-top: 6px;
    }
    .input-field:focus {
      border-color: #F05A22;
      background: #FFFFFF;
    }
    .quick-tags {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .tag-btn {
      background: #F2F4F6;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #4E5968;
      cursor: pointer;
    }

    /* Roulette Modal & Animation */
    .center-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 110;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .center-modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .dialog-card {
      width: 100%;
      max-width: 320px;
      background: white;
      border-radius: 28px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .center-modal.show .dialog-card {
      transform: scale(1);
    }
    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(1800deg); }
    }
    .spinning {
      animation: spinWheel 3s cubic-bezier(0.15, 0.9, 0.2, 1) forwards;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: max(30px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(25, 31, 40, 0.92);
      color: white;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="header-safe">
    <div class="logo-container" onclick="resetDemo()">
      <span class="logo-ok">OK</span>
      <span class="logo-excl">!</span>
      <span class="logo-bank">저축은행</span>
    </div>

    <div class="header-icons">
      <!-- Consultation icon -->
      <button class="header-icon-btn" onclick="showToast('고객 상담 서비스입니다.')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.6 12h.01M12 12h.01M15.4 12h.01M21 12c0 4.418-4.03 8-9 8a9.8 9.8 0 01-2.55-.34A5.97 5.97 0 015.4 20.97a.75.75 0 01-.84-.84c.14-.88.47-1.75.98-2.48C3.3 16.03 2.25 14.12 2.25 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </button>

      <!-- Bell notification icon -->
      <button class="header-icon-btn" onclick="showToast('새로운 알림이 없습니다.')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.86 17.08a23.85 23.85 0 005.45-1.31A8.97 8.97 0 0118 9.75V9a6 6 0 00-12 0v.75a8.97 8.97 0 01-2.31 6.02 23.9 23.9 0 005.45 1.31m5.72 0a24.25 24.25 0 01-5.72 0m5.72 0a3 3 0 11-5.72 0" />
        </svg>
        <span class="badge-dot"></span>
      </button>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main>
    <!-- Greeting & Attendance -->
    <div class="user-row">
      <h1 class="user-greeting">조원웅 님 자산</h1>
      <button id="btnAtt" class="btn-att" onclick="toggleAttendance()">
        <span id="attIcon">🤎</span>
        <span id="attText">출석하기</span>
      </button>
    </div>

    <!-- Loan Limit Banner -->
    <div class="banner-box" onclick="showToast('대출한도 조회 이벤트로 이동합니다.')">
      <span>🔍</span>
      <span>대출한도 확인만 해도 매일 포인트를 드려요!</span>
    </div>

    <!-- Accounts Carousel -->
    <div class="carousel-container no-scrollbar">
      <!-- Main Card -->
      <div class="card account-card">
        <div class="acc-content-top">
          <div class="acc-badge">
            <div class="acc-icon">₩</div>
            <div class="acc-title">OK읏맨 서포터즈통장</div>
          </div>
          <div class="acc-balance">
            <span id="balanceText">18,909,423</span><span class="unit">원</span>
          </div>
        </div>
        <button class="btn-orange" onclick="openTransferModal()">송금하기</button>
      </div>

      <!-- Secondary Card (Peeking) -->
      <div class="card account-card">
        <div class="acc-content-top">
          <div class="acc-badge">
            <div class="acc-title" style="font-size: 13px; color: #8B95A1; font-weight: 600;">쉽고 빠르게</div>
          </div>
          <div class="acc-balance" style="font-size: 24px;">
            <span>OK대출</span>
          </div>
        </div>
        <button class="btn-orange" onclick="showToast('간편 대출 신청 페이지입니다.')">대출 신청</button>
      </div>
    </div>

    <!-- Reward / Coupon Card -->
    <div class="card info-card">
      <div class="row-item" onclick="showToast('포인트 내역 페이지입니다.')">
        <div class="row-left">
          <div class="point-badge">P</div>
          <div class="row-label">포인트</div>
        </div>
        <div class="row-value"><span id="pointText">510</span> P</div>
      </div>

      <div class="row-item" onclick="showToast('보유 쿠폰함입니다.')">
        <div class="row-left">
          <span style="font-size: 18px;">🎟️</span>
          <div class="row-label">쿠폰</div>
        </div>
        <div class="row-value">0개</div>
      </div>

      <hr class="card-divider">

      <div class="roulette-promo">
        <div>
          <div class="roulette-title">룰렛 돌리고<br>경품 받아가세요!</div>
          <button class="btn-roulette" onclick="openRouletteModal()">룰렛돌리기</button>
        </div>

        <!-- Graphic Illustration -->
        <div style="position: relative; width: 76px; height: 76px; cursor: pointer;" onclick="openRouletteModal()">
          <svg width="76" height="76" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" fill="#FFE5D9" stroke="#FFA270" stroke-width="4" />
            <path d="M50 50 L50 6 A44 44 0 0 1 94 50 Z" fill="#F05A22" />
            <path d="M50 50 L94 50 A44 44 0 0 1 50 94 Z" fill="#FFC72C" />
            <path d="M50 50 L50 94 A44 44 0 0 1 6 50 Z" fill="#FF8A50" />
            <path d="M50 50 L6 50 A44 44 0 0 1 50 6 Z" fill="#FFA270" />
            <circle cx="50" cy="50" r="14" fill="#FFFFFF" stroke="#F05A22" stroke-width="3" />
            <circle cx="50" cy="50" r="6" fill="#F05A22" />

  <!-- ==================== ROULETTE MODAL ==================== -->
  <div id="rouletteModal" class="center-modal" onclick="closeRouletteModal(event)">
    <div class="dialog-card" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">

        <button class="close-btn" onclick="closeRouletteModal()">✕</button>
      </div>
      <p style="font-size: 13px; color: #8B95A1; margin-bottom: 16px;">매일 최대 1,000P 당첨 기회!</p>

      <div style="position: relative; width: 170px; height: 170px; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;">

          <circle cx="50" cy="50" r="46" fill="#FFF" stroke="#F05A22" stroke-width="4" />

      <button id="spinBtn" class="btn-orange" onclick="spinRoulette()">지금 돌리기!</button>

  <!-- ==================== TOAST ==================== -->
  <div id="toast" class="toast">알림</div>

  <script>
    // Safe storage wrapper (supports localStorage, sandboxed iOS files, memory fallback)
    const storage = {
      get(k, def) {
        try {
          const val = localStorage.getItem(k);
          return val !== null ? val : def;
        } catch(e) {
          return def;
        }
      },
      set(k, val) {
        try {
          localStorage.setItem(k, val);
        } catch(e) {}
      },
      clear() {
        try {
          localStorage.clear();
        } catch(e) {}
      }
    };

    let balance = parseInt(storage.get('ok_bal', '18909423'));
    let points = parseInt(storage.get('ok_pts', '510'));
    let attended = storage.get('ok_att', 'false') === 'true';

    function fmt(n) { return n.toLocaleString('ko-KR'); }

    function sync() {
      const balEl = document.getElementById('balanceText');
      const sheetBalEl = document.getElementById('sheetBalance');
      const ptsEl = document.getElementById('pointText');
      if (balEl) balEl.textContent = fmt(balance);
      if (sheetBalEl) sheetBalEl.textContent = fmt(balance) + '원';
      if (ptsEl) ptsEl.textContent = fmt(points);

      const btn = document.getElementById('btnAtt');
      const txt = document.getElementById('attText');
      const ico = document.getElementById('attIcon');
      if (btn && txt && ico) {
        if (attended) {
          btn.classList.add('attended');
          txt.textContent = '출석완료';
          ico.textContent = '✔️';
        } else {
          btn.classList.remove('attended');
          txt.textContent = '출석하기';
          ico.textContent = '🤎';
        }
      }
    }

    function toggleAttendance() {
      if (attended) {
        showToast('이미 오늘의 출석체크를 완료했습니다.');
        return;
      }
      attended = true;
      points += 10;
      storage.set('ok_att', 'true');
      storage.set('ok_pts', points);
      sync();
      showToast('출석 완료! +10P 적립되었습니다 🎉');
    }

    // Roulette Handlers
    function openRouletteModal() {
      document.getElementById('rouletteModal').classList.add('show');
    }

    function closeRouletteModal(e) {
      document.getElementById('rouletteModal').classList.remove('show');
    }

    function spinRoulette() {
      const wheel = document.getElementById('rouletteSvg');
      const btn = document.getElementById('spinBtn');
      btn.disabled = true;
      btn.textContent = '추첨 중...';
      
      wheel.classList.remove('spinning');
      void wheel.offsetWidth;
      wheel.classList.add('spinning');

      setTimeout(() => {
        const bonus = 100;
        points += bonus;
        storage.set('ok_pts', points);
        sync();
        btn.disabled = false;
        btn.textContent = '지금 돌리기!';
        closeRouletteModal();
        showToast(`축하합니다! 룰렛 이벤트로 ${bonus}P에 당첨되었습니다! 🎊`);
      }, 3000);
    }

    // Transfer Modal Handlers
    function openTransferModal() {
      document.getElementById('transferModal').classList.add('show');
      document.getElementById('amtInput').value = '';
      document.getElementById('recInput').value = '';
    }

    function closeTransferModal(e) {
      document.getElementById('transferModal').classList.remove('show');
    }

    function addAmt(v) {
      const el = document.getElementById('amtInput');
      el.value = parseInt(el.value || '0') + v;
    }

    function setMaxAmt() {
      document.getElementById('amtInput').value = balance;
    }

    function executeTransfer() {
      const amt = parseInt(document.getElementById('amtInput').value || '0');
      const rec = document.getElementById('recInput').value.trim() || '받는 분';
      if (!amt || amt <= 0) {
        showToast('보낼 금액을 입력하세요.');
        return;
      }
      if (amt > balance) {
        showToast('잔액이 부족합니다.');
        return;
      }
      balance -= amt;
      storage.set('ok_bal', balance);
      sync();
      document.getElementById('transferModal').classList.remove('show');
      showToast(`${rec}님에게 ${fmt(amt)}원을 송금했습니다.`);
    }

    // Tabs
    function switchTab(el, name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      if (name !== '홈') showToast(`[${name}] 탭으로 전환되었습니다.`);
    }

    let tTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(tTimer);
      tTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function resetDemo() {
      if (confirm('초기 데이터(18,909,423원 / 510P)로 리셋할까요?')) {
        balance = 18909423;
        points = 510;
        attended = false;
        storage.clear();
        sync();
        showToast('초기 상태로 복원되었습니다.');
      }
    }

    sync();
  </script>
